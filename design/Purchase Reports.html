<!DOCTYPE html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Purchase Reports · Sontic Plus</title><link rel="stylesheet" href="styles.css"><script src="theme.js"></script></head><body><div id="r"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="nav.js"></script><script src="tabs.js"></script><script src="_ds_bundle.js"></script>
<script type="text/babel">const egp=n=>"EGP "+(+n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});const {AppShell,StatCard,Tabs,TableToolbar,DataTable,Pagination,Badge,Button,Field,Select,Input}=window.Industry_indust;
const shell=(tab,children)=><AppShell items={SP_NAV} activeId="re" title="Reports" tabs={SP_REPORT_TABS} moreTabs={SP_REPORT_MORE} activeTab={tab} userName="admin" userRole="Administrator" footer="All Rights Reserved © 2026 Sontic Plus">{children}</AppShell>;
const WH=({v,set,opts})=><div style={{width:420,margin:"0 auto 24px"}}><Field label="Warehouse"><Select value={v} onChange={e=>set(e.target.value)} options={opts}/></Field></div>;
const sale=[["SA_11149","71800.00"],["SA_11148","31920.00"],["SA_11147","7980.00"],["SA_11146","11970.00"],["SA_11145","7980.00"],["SA_11144","7480.00"],["SA_11143","11970.00"],["SA_11142","11470.00"],["SA_11141","11970.00"],["SA_11140","11970.00"]].map((r,i)=>({id:i,ref:r[0],total:egp(r[1]),paid:egp(r[1]),due:"EGP 0.00"}));
const code=v=><span className="sp-code">{v}</span>;
const P=[["PU_1119","4930.00","12:25 AM","2025-01-06"],["PU_1118","2220.00","1:26 AM","2024-04-20"],["PU_1117","162000.00","3:56 AM","2024-04-01"],["PU_1116","45000.00","11:28 PM","2024-02-03"],["PU_1115","49300.00","11:23 PM","2024-02-03"],["PU_1114","64350.00","11:15 PM","2024-02-03"],["PU_1113","30260.00","11:12 PM","2024-02-03"],["PU_1112","1620.00","11:02 PM","2024-02-03"],["PU_1111","95000.00","11:08 PM","2024-02-02"]].map((r,i)=>({id:i,ref:r[0],total:egp(r[1]),paid:"EGP 0.00",due:"EGP 0.00",at:r[2]+" · "+r[3]}));
function App(){const [q,setQ]=React.useState("");const rows=P.filter(r=>r.ref.toLowerCase().includes(q.toLowerCase()));
return shell("purchase",<><TableToolbar value={q} onSearch={setQ}><Button variant="secondary" iconOnly icon="filter" aria-label="Filter"/><Button icon="file-spreadsheet">EXCEL</Button><div style={{width:240}}><Input type="date" aria-label="Select Date"/></div></TableToolbar>
<DataTable columns={[{key:"ref",header:"Reference",render:code},{key:"sup",header:"Supplier",render:()=>"China",primary:true},{key:"s",header:"Status",render:()=><Badge status="Received"/>},{key:"total",header:"Grand Total",align:"right"},{key:"paid",header:"Paid",align:"right"},{key:"due",header:"Due",align:"right"},{key:"pt",header:"Payment Type",render:()=><Badge tone="primary" dot={false}>Cash</Badge>},{key:"at",header:"Created On",render:v=><Badge tone="info" dot={false}>{v}</Badge>}]} rows={rows}><Pagination page={1} pageSize={10} total={rows.length}/></DataTable></>)}
ReactDOM.createRoot(document.getElementById("r")).render(<App/>);</script></body></html>
