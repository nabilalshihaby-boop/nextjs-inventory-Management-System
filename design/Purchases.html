<!DOCTYPE html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Purchases · Sontic Plus</title><link rel="stylesheet" href="styles.css"><script src="theme.js"></script><style>.sp-qty{display:inline-flex;align-items:stretch}.sp-qty .sp-btn{width:42px;padding:0;border-radius:var(--radius-md) 0 0 var(--radius-md)}.sp-qty .sp-btn:last-child{border-radius:0 var(--radius-md) var(--radius-md) 0}.sp-qty .sp-input{width:56px;text-align:center;padding:0;border-radius:0;border-left:0;border-right:0}.sp-sug{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-lg);padding:6px}.sp-sum{width:490px;margin-left:auto;border:1px solid var(--border);border-radius:var(--radius-md)}.sp-sum div{display:flex;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border);font:400 14px/20px var(--font-body)}.sp-sum div:last-child{border-bottom:0;color:var(--primary-700);font-weight:700}.sp-band{background:var(--neutral-100);padding:14px 20px;font:700 12px/16px var(--font-body);text-transform:uppercase;letter-spacing:.05em;color:var(--text-2);border-radius:var(--radius-md)}.sp-info{display:flex;flex-direction:column;gap:10px;padding:16px 20px;font:400 14px/20px var(--font-body)}.sp-info span{display:flex;align-items:center;gap:10px}.sp-info .sp-icon{color:var(--primary-600)}.sp-ed{margin-left:8px}</style></head><body><div id="r"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="nav.js"></script><script src="tabs.js"></script><script src="_ds_bundle.js"></script><script src="demo.js"></script><script type="text/babel" src="demo.jsx"></script>
<script type="text/babel">const egp=n=>"EGP "+(+n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});const {AppShell,TableToolbar,DataTable,Pagination,Badge,Button,Input,ConfirmDeleteModal}=window.Industry_indust;
const cols=[{key:"ref",header:"Reference",render:v=><span className="sp-code">{v}</span>},{key:"sup",header:"Supplier",render:v=>DEMO.supName(v),primary:true},{key:"wh",header:"Warehouse",render:()=>"Office"},{key:"st",header:"Status",render:()=><Badge status="Received"/>},{key:"total",header:"Grand Total",align:"right",render:v=>egp(v)},{key:"paid",header:"Paid",align:"right",render:v=>egp(v)},{key:"due",header:"Due",align:"right",render:v=>egp(v)},{key:"status",header:"Payment Status",render:v=><Badge status={v}/>},{key:"at",header:"Created On",render:v=><Badge tone="info" dot={false}>{v}</Badge>}];
function App(){const db=useDemo();const D=DEMO.invoices().map((r,i)=>({...r,id:i,at:r.at+" · "+r.date}));const [q,setQ]=React.useState("");const [del,setDel]=React.useState(null);const [gone,setGone]=React.useState([]);const rows=D.filter(r=>!gone.includes(r.id)&&r.ref.toLowerCase().includes(q.toLowerCase()));const sum=rows.reduce((a,r)=>a+r.total,0);const ps=rows.reduce((a,r)=>a+r.paid,0),pd=rows.reduce((a,r)=>a+r.due,0);
return <AppShell items={SP_NAV} activeId="pu1" title="Purchases" userName="admin" userRole="Administrator" footer="All Rights Reserved © 2026 Sontic Plus">
<TableToolbar value={q} onSearch={setQ}><Button variant="secondary" iconOnly icon="filter" aria-label="Filter"/><div style={{width:240}}><Input type="date" aria-label="Select Date"/></div><Button icon="plus" onClick={()=>location.href="Create Purchase.html"}>Create Purchase</Button></TableToolbar>
<DataTable columns={cols} rows={rows} footer={{total:egp(sum),paid:egp(ps),due:egp(pd)}} actions={r=>[{label:"View Purchase",icon:"eye",onClick:()=>location.href="Purchase Details.html"},{label:"Download PDF",icon:"file-down"},{label:"Edit Purchase",icon:"pencil",onClick:()=>location.href="Create Purchase.html"},"-",{label:"Delete Purchase",icon:"trash-2",danger:true,onClick:()=>setDel(r)}]}><Pagination page={1} pageSize={10} total={rows.length}/></DataTable><ConfirmDeleteModal open={!!del} itemType="purchase" itemName={del?del.ref:undefined} onCancel={()=>setDel(null)} onConfirm={()=>{setGone([...gone,del.id]);setDel(null)}}/></AppShell>}
ReactDOM.createRoot(document.getElementById("r")).render(<App/>);</script></body></html>
