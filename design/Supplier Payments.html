<!DOCTYPE html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Supplier Payments · Sontic Plus</title><link rel="stylesheet" href="styles.css"><script src="theme.js"></script></head><body><div id="r"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="nav.js"></script><script src="tabs.js"></script><script src="_ds_bundle.js"></script><script src="demo.js"></script><script src="customer-data.js"></script><script src="fin.js"></script><script type="text/babel" src="demo.jsx"></script><script type="text/babel" src="finui.jsx"></script>
<script type="text/babel">const {AppShell,PageHeader,TableToolbar,DataTable,Pagination,Badge,Button,Input,Select,Modal,Icon,ConfirmDeleteModal}=window.Industry_indust;const egp=DEMO.egp,dm=d=>d.split("-").reverse().join("/");
const ST={Applied:"success","Partially Applied":"warning",Unallocated:"neutral"};
function App(){const db=useDemo();useFin();const [toast,setToast]=useToast(DEMO.takeFlash());const [q,setQ]=React.useState(""),[sup,setSup]=React.useState("All"),[me,setMe]=React.useState("All"),[st,setSt]=React.useState("All"),[from,setFrom]=React.useState(""),[to,setTo]=React.useState("");
const [page,setPage]=React.useState(1),[size,setSize]=React.useState(10),[del,setDel]=React.useState(null),[view,setView]=React.useState(null),[modal,setModal]=React.useState(new URLSearchParams(location.search).get("new")==="1");
const seed=db.payments.map(p=>({id:p.id,ref:p.ref,date:p.date,name:DEMO.supName(p.sup),sid:p.sup,method:p.method,amount:p.amount,txn:p.txn,notes:p.notes,alloc:p.alloc,acct:"",demo:false,status:DEMO.payStatus(p)}));
const dem=FIN.list("supplier").map(p=>({id:p.id,ref:p.ref,date:p.date,name:p.party,method:p.method,amount:p.amount,txn:p.txn,notes:p.notes,alloc:p.inv?[{inv:p.inv,amt:p.amount}]:[],acct:p.acct,demo:true,status:p.inv?"Applied":"Unallocated"}));
const all=[...dem,...seed.sort((a,b)=>b.date.localeCompare(a.date))];
const rows=all.filter(p=>(!q||(p.ref+p.txn+p.notes+p.name).toLowerCase().includes(q.toLowerCase()))&&(sup==="All"||p.name===sup)&&(me==="All"||p.method===me)&&(st==="All"||p.status===st)&&(!from||p.date>=from)&&(!to||p.date<=to));
const shown=rows.slice((page-1)*size,page*size);const filt=q||sup!=="All"||me!=="All"||st!=="All"||from||to;const reset=()=>{setQ("");setSup("All");setMe("All");setSt("All");setFrom("");setTo("")};
const cols=[{key:"date",header:"Payment Date",render:dm},{key:"ref",header:"Reference No.",render:(v,r)=><span><span className="sp-code">{v}</span>{r.demo&&<> <Badge tone="warning" dot={false}>Demo</Badge></>}</span>,text:r=>r.ref},{key:"name",header:"Supplier",primary:true},{key:"method",header:"Payment Method",render:v=><Badge tone="primary" dot={false}>{v}</Badge>},{key:"acct",header:"Paid From",render:v=>v?FIN.accName(v):"—"},{key:"amount",header:"Amount",align:"right",render:v=>egp(v)},{key:"alloc",header:"Applied To",render:v=>v.length?v.map(a=>a.inv).join(", "):<Badge tone="neutral" dot={false}>Unallocated</Badge>},{key:"notes",header:"Notes",render:v=>v||"—"}];
return <AppShell items={SP_NAV} activeId="pe4" title="Supplier Payments" userName="admin" userRole="Administrator" footer="All Rights Reserved © 2026 Sontic Plus">
<PageHeader title="Supplier Payments"><Button icon="plus" onClick={()=>setModal(true)}>Record Supplier Payment</Button></PageHeader>
<TableToolbar value={q} onSearch={v=>{setQ(v);setPage(1)}} searchPlaceholder="Search payments">
<div style={{width:190}}><Select aria-label="Supplier" value={sup} onChange={e=>{setSup(e.target.value);setPage(1)}} options={[{value:"All",label:"All Suppliers"},...FIN.parties("supplier")]}/></div>
<div style={{width:170}}><Select aria-label="Payment Method" value={me} onChange={e=>{setMe(e.target.value);setPage(1)}} options={["All","Cash","Bank Transfer","Card","Cheque"]}/></div>
<div style={{width:170}}><Select aria-label="Status" value={st} onChange={e=>{setSt(e.target.value);setPage(1)}} options={["All","Applied","Partially Applied","Unallocated"]}/></div>
<div style={{width:160}}><Input type="date" aria-label="From date" value={from} onChange={e=>{setFrom(e.target.value);setPage(1)}}/></div><div style={{width:160}}><Input type="date" aria-label="To date" value={to} onChange={e=>{setTo(e.target.value);setPage(1)}}/></div></TableToolbar>
{rows.length===0?<div className="sp-card sp-empty"><Icon name="inbox" size={36}/><div className="t-section-title">{filt?"No payments match your filters":"No supplier payments yet"}</div>{filt?<Button variant="secondary" onClick={reset}>Clear filters</Button>:<Button icon="plus" onClick={()=>setModal(true)}>Record Supplier Payment</Button>}</div>
:<DataTable columns={cols} rows={shown} footer={{amount:egp(rows.reduce((a,r)=>a+r.amount,0))}} actions={r=>[{label:"View",icon:"eye",onClick:()=>setView(r)},{label:"Account Statement",icon:"file-text",onClick:()=>location.href="Supplier Statement.html?supplier="+encodeURIComponent(r.name)},...(r.demo?[]:[{label:"Edit",icon:"pencil",onClick:()=>location.href="Record Supplier Payment.html?edit="+r.id}]),"-",{label:"Delete",icon:"trash-2",danger:true,onClick:()=>setDel(r)}]}><Pagination page={page} pageSize={size} total={rows.length} onPage={setPage} onPageSize={n=>{setSize(n);setPage(1)}}/></DataTable>}
<Modal open={!!view} size="md" title={view?"Payment "+view.ref:""} onClose={()=>setView(null)} footer={<><Button variant="secondary" onClick={()=>setView(null)}>Close</Button>{view&&<Button icon="file-text" onClick={()=>location.href="Supplier Statement.html?supplier="+encodeURIComponent(view.name)}>Account Statement</Button>}</>}>
{view&&<div style={{display:"grid",gridTemplateColumns:"auto 1fr",gap:"12px 24px",font:"400 14px/20px var(--font-body)"}}><b>Supplier</b><span>{view.name}</span><b>Payment Date</b><span>{dm(view.date)}</span><b>Method</b><span>{view.method}</span><b>Amount</b><span>{egp(view.amount)}</span><b>Paid From</b><span>{view.acct?FIN.accName(view.acct):"—"}</span><b>Transaction No.</b><span>{view.txn||"—"}</span><b>Applied To</b><span>{view.alloc.length?view.alloc.map(a=>a.inv+" ("+egp(a.amt)+")").join(", "):"Unallocated"}</span><b>Status</b><span><Badge tone={ST[view.status]} dot={false}>{view.status}</Badge></span><b>Notes</b><span>{view.notes||"—"}</span></div>}</Modal>
<PaymentModal kind="supplier" open={modal} onClose={()=>setModal(false)} onSaved={r=>setToast("Payment "+r.ref+" recorded (demo only)")}/>
<ConfirmDeleteModal open={!!del} itemType="supplier payment" itemName={del?del.ref:undefined} onCancel={()=>setDel(null)} onConfirm={()=>{if(del.demo)FIN.remove(del.id);else DEMO.deletePayment(del.id);setDel(null);setToast("Payment deleted")}}/>{toast}</AppShell>}
ReactDOM.createRoot(document.getElementById("r")).render(<App/>);</script></body></html>
