<!DOCTYPE html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Customer Account Statement · Sontic Plus</title><link rel="stylesheet" href="styles.css"><script src="theme.js"></script></head><body><div id="r"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="nav.js"></script><script src="tabs.js"></script><script src="_ds_bundle.js"></script><script src="demo.js"></script><script src="customer-data.js"></script><script src="fin.js"></script><script type="text/babel" src="demo.jsx"></script><script type="text/babel" src="finui.jsx"></script>
<script type="text/babel">const egp=n=>"EGP "+(+n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const {AppShell,PageHeader,StatCard,TableToolbar,DataTable,Pagination,Button,Field,Select,Input,Badge,Icon}=window.Industry_indust;
const dm=d=>d.split("-").reverse().join("/"),code=v=><span className="sp-code">{v}</span>,TN={Sale:"warning",Payment:"success",Return:"info"};
function App(){useFin();const [toast,setToast]=useToast();const Q=new URLSearchParams(location.search);const first=CUSTOMERS.find(c=>c.id===Q.get("customer"))||CUSTOMERS[0];
const [f,setF]=React.useState({cu:first.id,from:"2026-01-01",to:"2026-12-31"});const [ap,setAp]=React.useState(f);const [err,setErr]=React.useState(""),[q,setQ]=React.useState(""),[page,setPage]=React.useState(1),[size,setSize]=React.useState(10);
const [modal,setModal]=React.useState(false);
const gen=()=>{if(!f.cu)return setErr("Choose a customer");if(!f.from||!f.to)return setErr("Select both dates");if(f.from>f.to)return setErr("From Date must be before To Date");setErr("");setAp(f);setPage(1)};
const cust=CUSTOMERS.find(c=>c.id===ap.cu);
const demo=FIN.list("customer").filter(p=>p.party===cust.name).map(p=>[p.date,p.ref,"Payment","Payment · "+p.method+(p.inv?" · "+p.inv:" · Unallocated")+(p.notes?" · "+p.notes:""),p.amount,true]);
const raw=[...cust.tx,...demo].sort((a,b)=>a[0].localeCompare(b[0]));
const open=raw.filter(t=>t[0]<ap.from).reduce((a,t)=>a+(t[2]==="Sale"?t[4]:-t[4]),0);let bal=open;
const inr=raw.filter(t=>t[0]>=ap.from&&t[0]<=ap.to).map((t,i)=>({id:i,date:t[0],ref:t[1],type:t[2],desc:t[3],demo:!!t[5],debit:t[2]==="Sale"?t[4]:0,credit:t[2]==="Sale"?0:t[4],bal:(bal+=(t[2]==="Sale"?t[4]:-t[4]))}));
const sales=inr.reduce((a,t)=>a+t.debit,0),paid=inr.filter(t=>t.type==="Payment").reduce((a,t)=>a+t.credit,0),ret=inr.filter(t=>t.type==="Return").reduce((a,t)=>a+t.credit,0),out=open+sales-paid-ret;
const rows=inr.filter(t=>(t.ref+t.desc+t.type).toLowerCase().includes(q.toLowerCase()));const shown=rows.slice((page-1)*size,page*size);
return <AppShell items={SP_NAV} activeId="re" title="Reports" tabs={SP_REPORT_TABS} moreTabs={SP_REPORT_MORE} activeTab="customer" userName="admin" userRole="Administrator" footer="All Rights Reserved © 2026 Sontic Plus">
<PageHeader title={"Customer Account Statement · "+cust.name}><Button icon="plus" onClick={()=>setModal(true)}>Record Customer Payment</Button></PageHeader>
<div className="sp-card" style={{padding:24,marginBottom:24}}><div style={{display:"grid",gridTemplateColumns:"repeat(3,minmax(0,1fr)) auto",gap:24,alignItems:"end"}}><Field label="Customer" required><Select value={f.cu} onChange={e=>setF({...f,cu:e.target.value})} options={CUSTOMERS.map(c=>({value:c.id,label:c.name}))}/></Field><Field label="From Date" required><Input type="date" value={f.from} onChange={e=>setF({...f,from:e.target.value})}/></Field><Field label="To Date" required><Input type="date" value={f.to} onChange={e=>setF({...f,to:e.target.value})}/></Field><Button icon="chart-column" onClick={gen}>Generate Report</Button></div>{err&&<div className="sp-error" style={{marginTop:12}}>{err}</div>}</div>
<div className="sp-kpi-grid" style={{gridTemplateColumns:"repeat(3,minmax(0,1fr))",marginBottom:32}}><StatCard tone="green" icon="shopping-cart" value={egp(sales)} label="Total Sales"/><StatCard tone="blue" icon="banknote" value={egp(paid)} label="Total Collected"/><StatCard tone="red" icon="circle-minus" value={egp(out)} label="Outstanding Balance" note={"Sales − Collected − Returns ("+egp(ret)+")"}/></div>
<TableToolbar value={q} onSearch={v=>{setQ(v);setPage(1)}} searchPlaceholder="Search transactions"><Button variant="secondary" icon="printer" onClick={()=>window.print()}>Print</Button></TableToolbar>
{inr.length===0?<div className="sp-card sp-empty"><Icon name="inbox" size={36}/><div className="t-section-title">No transactions in this period</div></div>:<DataTable columns={[{key:"date",header:"Date",render:dm},{key:"ref",header:"Reference",render:code},{key:"type",header:"Transaction Type",render:v=><Badge tone={TN[v]} dot={false}>{v}</Badge>},{key:"desc",header:"Description",primary:true,render:(v,r)=>r.demo?<span>{v} <Badge tone="warning" dot={false}>Demo</Badge></span>:v},{key:"debit",header:"Debit",align:"right",render:v=>v?egp(v):"—"},{key:"credit",header:"Credit",align:"right",render:v=>v?egp(v):"—"},{key:"bal",header:"Running Balance",align:"right",render:v=><b>{egp(v)}</b>}]} rows={shown} footer={{debit:egp(sales),credit:egp(paid+ret),bal:egp(out)}}><Pagination page={page} pageSize={size} total={rows.length} onPage={setPage} onPageSize={n=>{setSize(n);setPage(1)}}/></DataTable>}
<p className="t-caption" style={{marginTop:12}}>Debit increases the amount the customer owes (sales). Credit reduces it (collections and returns). Rows marked Demo were recorded in this session and reset on refresh.</p>
<PaymentModal kind="customer" open={modal} party={cust.name} onClose={()=>setModal(false)} onSaved={r=>setToast("Payment "+r.ref+" recorded (demo only)")}/>{toast}</AppShell>}
ReactDOM.createRoot(document.getElementById("r")).render(<App/>);</script></body></html>
