<!DOCTYPE html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Products · Sontic Plus</title><link rel="stylesheet" href="styles.css"><script src="theme.js"></script></head><body><div id="r"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="nav.js"></script><script src="_ds_bundle.js"></script>
<script type="text/babel">const egp=n=>"EGP "+(+n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});const {AppShell,TableToolbar,DataTable,Pagination,Badge,Button}=window.Industry_indust;
const rows=[["lip care set","006lpc","1790.00",100,"11:28 PM","03/02/2024"],["collagen powder","005cp","1690.00",110,"11:23 PM","03/02/2024"],["intensive hair serum set","001hs","2490.00",94,"11:15 PM","03/02/2024"],["ultrasonic scrubber","003uc","2990.00",7,"11:12 PM","03/02/2024"],["ipl laser hair removal","002","3990.00",0,"11:02 PM","03/02/2024"],["FACE FAT AND DOUBLE CHIN","001","3490.00",2,"11:08 PM","02/02/2024"]].map((r,i)=>({id:i,name:r[0],code:r[1],price:egp(r[2]),stock:r[3],at:r[4]+" · "+r[5]}));
const cols=[{key:"img",header:"Product",render:()=><span className="sp-thumb"/>},{key:"name",header:"Name",primary:true},{key:"code",header:"Code",render:v=><span className="sp-code">{v}</span>},{key:"brand",header:"Brand",render:()=>"GG"},{key:"price",header:"Price"},{key:"unit",header:"Product Unit",render:()=><Badge tone="neutral" dot={false}>piece</Badge>},{key:"stock",header:"In Stock",render:v=><b style={{fontWeight:600,color:v<=2?"var(--danger-700)":undefined}}>{v}</b>},{key:"at",header:"Created On",render:v=><Badge tone="info" dot={false}>{v}</Badge>}];
function App(){return <AppShell items={SP_NAV} activeId="p1" title="Products" userName="admin" userRole="Administrator" footer="All Rights Reserved © 2026 Sontic Plus">
<TableToolbar><Button variant="secondary" iconOnly icon="filter" aria-label="Filter"/><Button variant="secondary" icon="upload">Export Products</Button><Button variant="secondary" icon="download">Import Products</Button><Button icon="plus" onClick={()=>location.href="Create Product.html"}>Create Product</Button></TableToolbar>
<DataTable columns={cols} rows={rows}><Pagination page={1} pageSize={10} total={6}/></DataTable></AppShell>}
ReactDOM.createRoot(document.getElementById("r")).render(<App/>);</script></body></html>
