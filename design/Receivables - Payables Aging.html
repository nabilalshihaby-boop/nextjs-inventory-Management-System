<!DOCTYPE html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Receivables &amp; Payables Aging · Sontic Plus</title><link rel="stylesheet" href="styles.css"><script src="theme.js"></script></head><body><div id="r"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script><script src="nav.js"></script><script src="tabs.js"></script><script src="_ds_bundle.js"></script><script src="demo.js"></script><script src="customer-data.js"></script><script src="fin.js"></script><script type="text/babel" src="demo.jsx"></script><script type="text/babel" src="finui.jsx"></script>
<style>.sp-kpi-grid .sp-stat-value{font-size:20px}.ag-pill{display:inline-block;border-radius:999px;padding:2px 10px;font:600 13px/20px var(--font-body);white-space:nowrap}.ag-0{background:oklch(0.95 0.05 155);color:oklch(0.38 0.09 155)}.ag-1{background:oklch(0.95 0.07 95);color:oklch(0.38 0.08 80)}.ag-2{background:oklch(0.93 0.07 58);color:oklch(0.4 0.12 50)}.ag-3{background:oklch(0.92 0.06 25);color:oklch(0.42 0.17 25)}.ag-4{background:oklch(0.38 0.14 25);color:#fff}.pl-seg{display:inline-flex}@media print{.pl-noprint{display:none!important}}.ag-bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--neutral-200)}.ag-bar i{display:block}</style>
<script type="text/babel">const egp=n=>"EGP "+(+n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const {AppShell,PageHeader,StatCard,TableToolbar,DataTable,Pagination,Tabs,Button,Field,Select,Input,Badge,Icon,Modal}=window.Industry_indust;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const BASE="2026-11-16",MIN="2026-10-01",MAX="2026-12-31";
const add=(d,n)=>{const t=new Date(d+"T00:00:00Z");t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10)};
const diff=(a,b)=>Math.round((new Date(a+"T00:00:00Z")-new Date(b+"T00:00:00Z"))/864e5);
const dm=d=>d.split("-").reverse().join("/");
const BK=["Not Yet Due","1–30 Days","31–60 Days","61–90 Days","Over 90 Days"];
const bucket=days=>days<=0?0:days<=30?1:days<=60?2:days<=90?3:4;
const sum=(rows,i)=>rows.reduce((a,r)=>a+r.bk[i],0);
const Pill=({b,children})=><span className={"ag-pill ag-"+b}>{children}</span>;
function Cv({make,deps}){const r=React.useRef(null);React.useEffect(()=>{Chart.defaults.font.family=css("--font-body").replace(/"/g,"");Chart.defaults.color=css("--text-2");const c=new Chart(r.current,make());return()=>c.destroy()},deps);return <div style={{position:"relative",height:300}}><canvas ref={r}/></div>}
function App(){useFin();const [toast,setToast]=useToast();const [asOf,setAsOf]=React.useState(BASE),[tab,setTab]=React.useState("ar"),[q,setQ]=React.useState(""),[fb,setFb]=React.useState("All"),[sort,setSort]=React.useState("hi"),[page,setPage]=React.useState(1),[size,setSize]=React.useState(10),[sel,setSel]=React.useState(null),[pay,setPay]=React.useState(false),[busy,setBusy]=React.useState(false);
const valid=/^\d{4}-\d{2}-\d{2}$/.test(asOf)&&asOf>=MIN&&asOf<=MAX;
const ar=valid?FIN.aging("customer",asOf):[],ap=valid?FIN.aging("supplier",asOf):[];
const isAr=tab==="ar",all=isAr?ar:ap;const T=(r)=>r.reduce((a,x)=>a+x.tot,0),O=r=>r.reduce((a,x)=>a+x.over,0);
let rows=all.filter(r=>(!q||r.name.toLowerCase().includes(q.toLowerCase()))&&(fb==="All"||(fb==="Overdue"?r.over>0:r.bk[+fb]>0)));
rows=[...rows].sort((a,b)=>sort==="lo"?a.tot-b.tot:sort==="name"?a.name.localeCompare(b.name):b.tot-a.tot);
const shown=rows.slice((page-1)*size,page*size);const filt=q||fb!=="All";
const cell=b=>(v,r)=>r.bk[b]?(b===0?<span>{egp(r.bk[b])}</span>:<Pill b={b}>{egp(r.bk[b])}</Pill>):<span style={{color:"var(--text-3)"}}>—</span>;
const cols=[{key:"name",header:isAr?"Customer Name":"Supplier Name",primary:true},{key:"tot",header:"Total Outstanding",align:"right",render:v=><b>{egp(v)}</b>},...BK.map((l,b)=>({key:"b"+b,header:l.replace(" Days","  Days").replace("Not Yet Due","Not Yet Due"),align:"right",render:cell(b),text:r=>r.bk[b]}))];
const foot={tot:egp(rows.reduce((a,r)=>a+r.tot,0)),...Object.fromEntries(BK.map((_,b)=>["b"+b,egp(rows.reduce((a,r)=>a+r.bk[b],0))]))};
const rowsT=shown.map(r=>({...r,b0:r.bk[0],b1:r.bk[1],b2:r.bk[2],b3:r.bk[3],b4:r.bk[4]}));
const sw=(t)=>{setTab(t);setQ("");setFb("All");setPage(1)};
const d=sel?(isAr?ar:ap).find(r=>r.name===sel.name)||null:null;const dOver=d?d.over:0;const oldest=d?d.invs.filter(i=>i.b>0).sort((a,b)=>a.due.localeCompare(b.due))[0]:null;
return <AppShell items={SP_NAV} activeId="f5" title="Receivables &amp; Payables Aging" userName="admin" userRole="Administrator" footer="All Rights Reserved © 2026 Sontic Plus">
<PageHeader title="Receivables &amp; Payables Aging"><span className="pl-noprint" style={{display:"flex",gap:12,alignItems:"center",flexWrap:"wrap"}}><label style={{display:"flex",alignItems:"center",gap:8,font:"600 14px/20px var(--font-body)"}}>As of Date<div style={{width:170}}><Input type="date" min={MIN} max={MAX} value={asOf} onChange={e=>{setAsOf(e.target.value);setPage(1)}}/></div></label><Button variant="secondary" icon="printer" disabled={busy} onClick={()=>window.print()}>Print Report</Button><Button icon="file-down" disabled={busy} onClick={()=>{setBusy(true);setTimeout(()=>{setBusy(false);setToast("PDF export is a demonstration only")},900)}}>{busy?"Preparing…":"Export PDF"}</Button></span></PageHeader>
<p className="t-body" style={{margin:"-8px 0 24px",color:"var(--text-2)"}}>Monitor outstanding customer balances and supplier obligations by due date.</p>
{!valid?<div className="sp-card sp-empty"><Icon name="calendar-x" size={40}/><div className="t-section-title">No sample data for this date</div><div className="t-caption">Sample snapshots are available from 01/10/2026 to 31/12/2026.</div><Button onClick={()=>setAsOf(BASE)}>Use 16/11/2026</Button></div>:<>
<div className="sp-kpi-grid" style={{marginBottom:32}}><StatCard tone="teal" icon="hand-coins" value={egp(T(ar))} label="Total Accounts Receivable" note="Total outstanding"/><StatCard tone="red" icon="clock" value={egp(O(ar))} label="Overdue Receivables" note={T(ar)?(O(ar)/T(ar)*100).toFixed(1)+"% of receivables":"—"}/><StatCard tone="blue" icon="wallet" value={egp(T(ap))} label="Total Accounts Payable" note="Total outstanding"/><StatCard tone="amber" icon="clock" value={egp(O(ap))} label="Overdue Payables" note={T(ap)?(O(ap)/T(ap)*100).toFixed(1)+"% of payables":"—"}/></div>
<section className="sp-card" style={{marginBottom:32}}><div className="sp-card-head"><h2 className="t-section-title" style={{margin:0}}>Aging Summary · as of {dm(asOf)}</h2></div><div style={{padding:24}}><Cv deps={[asOf]} make={()=>({type:"bar",data:{labels:BK,datasets:[{label:"Receivables",data:BK.map((_,b)=>sum(ar,b)),backgroundColor:css("--tone-teal"),borderRadius:4},{label:"Payables",data:BK.map((_,b)=>sum(ap,b)),backgroundColor:css("--tone-violet"),borderRadius:4}]},options:{maintainAspectRatio:false,plugins:{legend:{position:"top"},tooltip:{callbacks:{label:c=>c.dataset.label+": "+egp(c.parsed.y)}}},scales:{y:{beginAtZero:true,ticks:{callback:v=>(v/1000)+"k"}}}}})}/></div></section>
<div style={{marginBottom:16}}><Tabs value={tab} onChange={sw} tabs={[{id:"ar",label:"Accounts Receivable — Customers"},{id:"ap",label:"Accounts Payable — Suppliers"}]}/></div>
<TableToolbar value={q} onSearch={v=>{setQ(v);setPage(1)}} searchPlaceholder={isAr?"Search customer":"Search supplier"}>
<div style={{width:190}}><Select aria-label="Aging category" value={fb} onChange={e=>{setFb(e.target.value);setPage(1)}} options={[{value:"All",label:"All Categories"},{value:"Overdue",label:"Any Overdue"},...BK.map((l,i)=>({value:String(i),label:l}))]}/></div>
<div style={{width:210}}><Select aria-label="Sort" value={sort} onChange={e=>setSort(e.target.value)} options={[{value:"hi",label:"Outstanding: high to low"},{value:"lo",label:"Outstanding: low to high"},{value:"name",label:"Name A–Z"}]}/></div></TableToolbar>
{rows.length===0?<div className="sp-card sp-empty"><Icon name="inbox" size={36}/><div className="t-section-title">{filt?"No "+(isAr?"customers":"suppliers")+" match your filters":"No outstanding balances"}</div>{filt&&<Button variant="secondary" onClick={()=>{setQ("");setFb("All")}}>Clear filters</Button>}</div>
:<DataTable columns={cols} rows={rowsT} footer={foot} actions={r=>[{label:"View Details",icon:"eye",onClick:()=>setSel(r)}]}><Pagination page={page} pageSize={size} total={rows.length} onPage={setPage} onPageSize={m=>{setSize(m);setPage(1)}}/></DataTable>}
<p className="t-caption" style={{marginTop:12}}>Sample data. Balances are a snapshot as of {dm(asOf)}; overdue days = As of Date − Due Date. Only unpaid invoice balances are included, and partial payments reduce the outstanding amount. Customer advances and unallocated payments are not applied to any aging bucket. The footer totals cover all rows that match the current filters, not only this page.</p></>}
<Modal open={!!d} size="lg" title={d?d.name:""} onClose={()=>setSel(null)} footer={<><Button variant="secondary" onClick={()=>setSel(null)}>Close</Button>{d&&<Button icon="banknote" onClick={()=>setPay(true)}>{isAr?"Record Customer Payment":"Record Supplier Payment"}</Button>}</>}>
{d&&<div style={{display:"flex",flexDirection:"column",gap:24}}>
<div style={{display:"grid",gridTemplateColumns:"repeat(3,minmax(0,1fr))",gap:16}}><div><div className="t-caption">Total Outstanding</div><div style={{font:"700 20px/28px var(--font-body)"}}>{egp(d.tot)}</div></div><div><div className="t-caption">Overdue Balance</div><div style={{font:"700 20px/28px var(--font-body)",color:d.over?"var(--danger-500)":"inherit"}}>{egp(d.over)}</div></div><div><div className="t-caption">Oldest Overdue Invoice</div><div style={{font:"600 14px/28px var(--font-body)"}}>{oldest?oldest.no+" · "+oldest.days+" days":"None"}</div></div></div>
{d.credit>0&&<div className="sp-badge sp-badge--info" style={{height:"auto",padding:"10px 14px",whiteSpace:"normal"}}><Icon name="info" size={16}/>Unallocated credit: {egp(d.credit)}. Shown separately; it is not applied to any aging bucket or invoice.</div>}
<div><div className="t-label" style={{marginBottom:8}}>Aging Distribution</div><div className="ag-bar">{d.bk.map((v,b)=>v>0&&<i key={b} className={"ag-"+b} style={{width:(v/d.tot*100)+"%"}} title={BK[b]+": "+egp(v)}/>)}</div>
<div style={{display:"flex",gap:16,flexWrap:"wrap",marginTop:10}}>{d.bk.map((v,b)=><span key={b} style={{font:"400 13px/20px var(--font-body)",display:"flex",gap:6,alignItems:"center"}}><span className={"ag-pill ag-"+b} style={{width:12,height:12,padding:0,borderRadius:3}}/>{BK[b]}: <b>{egp(v)}</b></span>)}</div></div>
<div className="sp-table-card" style={{boxShadow:"none"}}><table className="sp-table"><thead><tr><th>Invoice Number</th><th>Invoice Date</th><th>Due Date</th><th className="num">Original Amount</th><th className="num">Paid Amount</th><th className="num">Outstanding</th><th className="num">Days Overdue</th><th>Status</th></tr></thead><tbody>
{[...d.invs].sort((a,b)=>a.due.localeCompare(b.due)).map(i=><tr key={i.no}><td><span className="sp-code">{i.no}</span></td><td>{dm(i.date)}</td><td>{dm(i.due)}</td><td className="num">{egp(i.amount)}</td><td className="num">{i.paid?egp(i.paid):"—"}</td><td className="num"><b>{egp(i.out)}</b></td><td className="num">{i.days||"—"}</td><td><Pill b={i.b}>{i.b===0?"Not Yet Due":BK[i.b]}</Pill>{i.paid>0&&<span className="t-caption" style={{marginLeft:8}}>Partially paid</span>}</td></tr>)}</tbody></table></div></div>}</Modal>
<PaymentModal kind={isAr?"customer":"supplier"} open={pay} party={d?d.name:""} onClose={()=>setPay(false)} onSaved={r=>setToast("Payment "+r.ref+" recorded (demo only)")}/>{toast}</AppShell>}
ReactDOM.createRoot(document.getElementById("r")).render(<App/>);</script></body></html>
