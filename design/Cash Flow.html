<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<style>.sp-kpi-grid .sp-stat-value{font-size:22px}.pl-t{width:100%;border-collapse:collapse;font:400 14px/20px var(--font-body)}.pl-t td,.pl-t th{padding:12px 20px;border-bottom:1px solid var(--border)}.pl-t th{text-align:right;font:700 12px/16px var(--font-body);letter-spacing:.05em;text-transform:uppercase;color:var(--text-2);background:var(--neutral-100)}.pl-t th:first-child{text-align:left}.pl-t td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.pl-sec td{background:var(--primary-50);font-weight:700;color:var(--primary-700)}.pl-sec button{all:unset;display:flex;align-items:center;gap:8px;cursor:pointer}.pl-ind td:first-child{padding-left:48px;color:var(--text-2)}.pl-sub td{font-weight:700;background:var(--neutral-100)}.pl-net td{background:var(--primary-600);color:#fff;font:700 17px/24px var(--font-body);border-bottom:0}.pl-mg td{color:var(--text-3);font-size:13px;padding-top:8px;padding-bottom:8px}.pl-seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:var(--radius-md);overflow:hidden}.pl-seg button{border:0;background:#fff;padding:0 16px;height:36px;font:600 13px/1 var(--font-body);color:var(--text-2);cursor:pointer}.pl-seg button[aria-pressed="true"]{background:var(--primary-600);color:#fff}@media print{.pl-noprint{display:none!important}}</style>
<script type="text/babel">const egp=n=>"EGP "+(+n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});const sg=n=>(n>=0?"+":"−")+egp(Math.abs(n));

const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const RANGES={today:"Today",week:"This Week",month:"This Month",last:"Last Month",custom:"Custom Range"};
const ACC0=[{id:"a1",name:"Main Cash Register",o:30000,i:100000,x:85000},{id:"a2",name:"POS Cash Drawer",o:10000,i:90000,x:81750},{id:"a3",name:"Branch Cash Register",o:12500,i:65000,x:55000},{id:"a4",name:"CIB Business Account",o:130000,i:125000,x:45000},{id:"a5",name:"Banque Misr Account",o:67500,i:40000,x:18250}];
const IN0=[["Customer Collections",250000],["POS Cash & Card Receipts",145000],["Other Cash Receipts",25000]],OUT0=[["Supplier Payments",175000],["Operating Expenses Paid",65000],["Salaries & Wages Paid",30000],["Other Cash Payments",15000]];
const WEEKS0=[["Week 1",95000,65000],["Week 2",115000,72000],["Week 3",100000,68000],["Week 4",110000,80000]];
const TRANSFER={from:"a1",to:"a4",amt:20000};
const sum=a=>a.reduce((s,x)=>s+x,0);
const an=id=>ACC0.find(a=>a.id===id).name;
function Cv({make,deps,h=320}){const r=React.useRef(null);React.useEffect(()=>{Chart.defaults.font.family=css("--font-body").replace(/"/g,"");Chart.defaults.color=css("--text-2");const c=new Chart(r.current,make());return()=>c.destroy()},deps);return <div style={{position:"relative",height:h}}><canvas ref={r}/></div>}
function App(){useFin();const [toast,setToast]=useToast();
const fp=FIN.list("customer").concat(FIN.list("supplier")).filter(p=>p.date>="2026-05-01"&&p.date<="2026-05-31"),cp=fp.filter(p=>p.kind==="customer"),sp=fp.filter(p=>p.kind==="supplier"),sm=a=>a.reduce((t,p)=>t+p.amount,0),wk=d=>Math.min(3,Math.floor((+d.slice(8)-1)/7));
const IN=IN0.map(r=>r[0]==="Customer Collections"?[r[0],r[1]+sm(cp)]:r),OUT=OUT0.map(r=>r[0]==="Supplier Payments"?[r[0],r[1]+sm(sp)]:r),TI=sum(IN.map(r=>r[1])),TO=sum(OUT.map(r=>r[1]));
const ACC=ACC0.map(a=>({...a,i:a.i+sm(cp.filter(p=>p.acct===a.id)),x:a.x+sm(sp.filter(p=>p.acct===a.id))})),OPEN=sum(ACC.map(a=>a.o));
const WEEKS=WEEKS0.map((w,i)=>[w[0],w[1]+sm(cp.filter(p=>wk(p.date)===i)),w[2]+sm(sp.filter(p=>wk(p.date)===i))]);const [rng,setRng]=React.useState("month"),[acct,setAcct]=React.useState("all"),[cu,setCu]=React.useState({from:"2026-05-01",to:"2026-05-31"}),[cua,setCua]=React.useState(cu),[err,setErr]=React.useState("");
const [open,setOpen]=React.useState({in:true,out:true}),[view,setView]=React.useState("weekly"),[busy,setBusy]=React.useState(false);
const applyCu=()=>{if(!cu.from||!cu.to)return setErr("Select both dates");if(cu.from>cu.to)return setErr("From Date must be before To Date");setErr("");setCua(cu)};
const has=rng==="month"||(rng==="custom"&&cua.from==="2026-05-01"&&cua.to==="2026-05-31");
const sel=acct==="all"?null:ACC.find(a=>a.id===acct);
const o=sel?sel.o:OPEN,i=sel?sel.i:TI,x=sel?sel.x:TO,close=o+i-x,net=i-x;
const largest=OUT.slice().sort((a,b)=>b[1]-a[1])[0][0];
const tg=k=>setOpen({...open,[k]:!open[k]});
const Sec=({id,label})=><tr className="pl-sec"><td colSpan={3}><button type="button" onClick={()=>tg(id)} aria-expanded={open[id]}><Icon name={open[id]?"chevron-down":"chevron-right"} size={16}/>{label}</button></td></tr>;
const R=({cls,label,v,t,sign})=><tr className={cls}><td>{label}</td><td className="n" style={{color:sign&&cls!=="pl-net"?(v>=0?"var(--success-700,#15803d)":"var(--danger-500)"):undefined}}>{sign?sg(v):egp(v)}</td><td className="n" style={{opacity:.85}}>{t?(Math.abs(v)/t*100).toFixed(1)+"%":""}</td></tr>;
let cum=OPEN;const cumv=[OPEN,...WEEKS.map(w=>cum+=w[1]-w[2])];
const noAcct=<div className="sp-empty" style={{padding:40}}><Icon name="info" size={32}/><div className="t-section-title">Not available for a single account</div><div className="t-caption">The sample data has category and weekly detail for All Accounts only.</div><Button variant="secondary" onClick={()=>setAcct("all")}>Show All Accounts</Button></div>;
return <AppShell items={SP_NAV} activeId="f4" title="Cash Flow" userName="admin" userRole="Administrator" footer="All Rights Reserved © 2026 Sontic Plus">
<PageHeader title="Cash Flow Statement"><span className="pl-noprint" style={{display:"flex",gap:12,alignItems:"center",flexWrap:"wrap"}}><div style={{width:160}}><Select aria-label="Date range" value={rng} onChange={e=>setRng(e.target.value)} options={Object.entries(RANGES).map(([v,l])=>({value:v,label:l}))}/></div><div style={{width:210}}><Select aria-label="Account" value={acct} onChange={e=>setAcct(e.target.value)} options={[{value:"all",label:"All Accounts"},...ACC.map(a=>({value:a.id,label:a.name}))]}/></div><Button variant="secondary" icon="printer" disabled={busy} onClick={()=>window.print()}>Print Report</Button><Button icon="file-down" disabled={busy} onClick={()=>{setBusy(true);setTimeout(()=>{setBusy(false);setToast("PDF export is a demonstration only")},900)}}>{busy?"Preparing…":"Export PDF"}</Button></span></PageHeader>
<p className="t-body" style={{margin:"-8px 0 24px",color:"var(--text-2)"}}>Track how money enters and leaves your business.</p>
{rng==="custom"&&<div className="sp-card pl-noprint" style={{padding:20,marginBottom:24}}><div style={{display:"grid",gridTemplateColumns:"repeat(2,minmax(0,240px)) auto",gap:20,alignItems:"end"}}><Field label="From Date"><Input type="date" value={cu.from} onChange={e=>setCu({...cu,from:e.target.value})}/></Field><Field label="To Date"><Input type="date" value={cu.to} onChange={e=>setCu({...cu,to:e.target.value})}/></Field><Button onClick={applyCu}>Apply</Button></div>{err&&<div className="sp-error" style={{marginTop:12}}>{err}</div>}<p className="t-caption" style={{margin:"12px 0 0"}}>Sample data exists for 01/05/2026 – 31/05/2026 only.</p></div>}
{!has?<div className="sp-card sp-empty"><Icon name="calendar-x" size={40}/><div className="t-section-title">No sample data for {rng==="custom"?"this range":RANGES[rng]}</div><div className="t-caption">The demonstration covers This Month (May 2026).</div><Button onClick={()=>{setRng("month")}}>Show This Month</Button></div>:<>
<div className="sp-kpi-grid" style={{marginBottom:32}}><StatCard tone="violet" icon="wallet" value={egp(o)} label="Opening Cash Balance" note={sel?sel.name:"All accounts"}/><StatCard tone="green" icon="arrow-down-to-line" value={egp(i)} label="Total Cash Inflows"/><StatCard tone="red" icon="arrow-up-from-line" value={egp(x)} label="Total Cash Outflows"/><StatCard tone="teal" icon="banknote" value={egp(close)} label="Closing Cash Balance" note="Opening + Inflows − Outflows"/></div>
<section className="sp-card" style={{marginBottom:32}}><div className="sp-card-head"><h2 className="t-section-title" style={{margin:0}}>Cash Flow Statement · May 2026</h2></div>
{sel?noAcct:<table className="pl-t"><thead><tr><th>Account</th><th>Amount</th><th>% of Section</th></tr></thead><tbody>
<R cls="pl-sub" label="Opening Cash Balance" v={OPEN}/>
<Sec id="in" label="Cash Inflows"/>{open.in&&IN.map(r=><R key={r[0]} cls="pl-ind" label={r[0]} v={r[1]} t={TI}/>)}<R cls="pl-sub" label="Total Cash Inflows" v={TI}/>
<Sec id="out" label="Cash Outflows"/>{open.out&&OUT.map(r=><R key={r[0]} cls="pl-ind" label={r[0]} v={r[1]} t={TO}/>)}<R cls="pl-sub" label="Total Cash Outflows" v={TO}/>
<R cls="pl-sub" label="Net Cash Movement" v={TI-TO} sign/><R cls="pl-net" label="Closing Cash Balance" v={OPEN+TI-TO}/></tbody></table>}</section>
<section className="sp-card" style={{marginBottom:32}}><div className="sp-card-head" style={{justifyContent:"space-between"}}><h2 className="t-section-title" style={{margin:0}}>Cash Inflows vs. Outflows</h2><span className="pl-seg pl-noprint">{[["weekly","Weekly"],["cum","Closing balance"]].map(([k,l])=><button key={k} type="button" aria-pressed={view===k} onClick={()=>setView(k)}>{l}</button>)}</span></div>
<div style={{padding:24}}>{sel?noAcct:<Cv deps={[view]} make={()=>view==="weekly"?({type:"bar",data:{labels:WEEKS.map(w=>w[0]),datasets:[{label:"Inflows",data:WEEKS.map(w=>w[1]),backgroundColor:css("--tone-green"),borderRadius:4},{label:"Outflows",data:WEEKS.map(w=>w[2]),backgroundColor:css("--tone-red"),borderRadius:4}]},options:{maintainAspectRatio:false,plugins:{legend:{position:"top"},tooltip:{callbacks:{label:c=>c.dataset.label+": "+egp(c.parsed.y)}}},scales:{y:{beginAtZero:true,ticks:{callback:v=>(v/1000)+"k"}}}}}):({type:"line",data:{labels:["Opening",...WEEKS.map(w=>w[0])],datasets:[{label:"Closing cash balance",data:cumv,borderColor:css("--tone-teal"),backgroundColor:css("--tone-teal"),tension:.25,pointRadius:5}]},options:{maintainAspectRatio:false,plugins:{legend:{position:"top"},tooltip:{callbacks:{label:c=>c.dataset.label+": "+egp(c.parsed.y)}}},scales:{y:{beginAtZero:false,ticks:{callback:v=>(v/1000)+"k"}}}}})}/>}</div></section>
<section className="sp-card" style={{marginBottom:32}}><div className="sp-card-head"><h2 className="t-section-title" style={{margin:0}}>Cash Flow by Account</h2></div><div className="sp-table-scroll"><table className="pl-t"><thead><tr><th>Account</th><th>Opening</th><th>Inflows</th><th>Outflows</th><th>Closing</th></tr></thead><tbody>
{ACC.map(a=><tr key={a.id} style={{background:acct===a.id?"var(--primary-50)":undefined,cursor:"pointer"}} onClick={()=>setAcct(acct===a.id?"all":a.id)}><td style={{fontWeight:acct===a.id?700:400}}>{a.name}</td><td className="n">{egp(a.o)}</td><td className="n" style={{color:"var(--success-700,#15803d)"}}>{egp(a.i)}</td><td className="n" style={{color:"var(--danger-500)"}}>{egp(a.x)}</td><td className="n"><b>{egp(a.o+a.i-a.x)}</b></td></tr>)}
<tr className="pl-sub"><td>Total</td><td className="n">{egp(OPEN)}</td><td className="n">{egp(TI)}</td><td className="n">{egp(TO)}</td><td className="n">{egp(OPEN+TI-TO)}</td></tr></tbody></table></div><p className="t-caption" style={{margin:0,padding:"12px 20px"}}>Illustrative balances for this report only. Click a row to filter by account.</p></section>
<section className="sp-card" style={{marginBottom:32,padding:24}}><div style={{display:"flex",gap:16,alignItems:"flex-start"}}><span style={{width:44,height:44,borderRadius:"var(--radius-md)",background:"var(--primary-100)",color:"var(--primary-700)",display:"grid",placeItems:"center",flex:"none"}}><Icon name="arrow-left-right" size={22}/></span><div style={{flex:1}}><h2 className="t-section-title" style={{margin:"0 0 6px"}}>Internal Transfers Between Accounts</h2><p className="t-body" style={{margin:"0 0 16px",color:"var(--text-2)"}}>Moving money between two accounts owned by the business does not change total business cash. Transfers are excluded from the cash inflows and outflows above.</p>
<div style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap",background:"var(--neutral-100)",borderRadius:"var(--radius-md)",padding:"14px 16px",font:"600 14px/20px var(--font-body)"}}><span>{an(TRANSFER.from)}</span><Icon name="arrow-right" size={18}/><span>{an(TRANSFER.to)}</span><Badge tone="info" dot={false}>Sample transfer</Badge><span style={{marginLeft:"auto",color:"var(--primary-700)"}}>{egp(TRANSFER.amt)}</span></div>
<div className="t-caption" style={{marginTop:10}}>{sel?(sel.id===TRANSFER.from?"Account view: "+sel.name+" sent "+egp(TRANSFER.amt)+" as an internal transfer (shown separately from external outflows).":sel.id===TRANSFER.to?"Account view: "+sel.name+" received "+egp(TRANSFER.amt)+" as an internal transfer (shown separately from external inflows).":"Account view: "+sel.name+" has no internal transfers in this sample."):"Net effect on total business cash: EGP 0.00"}</div></div></div></section>
<h2 className="t-section-title" style={{margin:"0 0 16px"}}>Cash Flow Insights</h2>
<div className="sp-kpi-grid" style={{gridTemplateColumns:"repeat(3,minmax(0,1fr))"}}>{[["Net Cash Movement",sg(net),"Inflows − Outflows",net>=0?"var(--success-700,#15803d)":"var(--danger-500)"],["Cash Inflow / Outflow Ratio",(i/x).toFixed(2)+"x","Inflows / Outflows","var(--primary-700)"],["Largest Outflow Category",sel?"Not available":largest,sel?"Category detail is for All Accounts":egp(OUT[0][1])+" of "+egp(TO),"var(--primary-700)"]].map(([l,v,f,c])=><div key={l} className="sp-card" style={{padding:20}}><div className="t-caption">{l}</div><div style={{font:"700 "+(v.length>14?22:28)+"px/36px var(--font-body)",margin:"6px 0",color:c}}>{v}</div><div className="t-caption">{f}</div></div>)}</div>
<p className="t-caption" style={{marginTop:16}}>Sample data for demonstration. Customer collections and supplier payments are the only items that move cash; unpaid invoices and unpaid supplier bills are not included. Profit &amp; Loss and Cash Flow are different views of the business.{fp.length>0&&" This view includes "+fp.length+" demo payment(s) recorded in this session."}{FIN.get().payments.length>fp.length&&" "+(FIN.get().payments.length-fp.length)+" demo payment(s) dated outside May 2026 are not shown."}</p></>}{toast}</AppShell>}
ReactDOM.createRoot(document.getElementById("r")).render(<App/>);</script></body></html>
