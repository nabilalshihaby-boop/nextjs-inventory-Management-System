<!DOCTYPE html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>POS · Sontic Plus</title><link rel="stylesheet" href="styles.css"><script src="theme.js"></script><style>body{background:var(--primary-50)}.pos{display:grid;grid-template-columns:clamp(440px,42%,610px) minmax(0,1fr);gap:15px;padding:15px;height:100vh}.pos-col{display:flex;flex-direction:column;gap:15px;min-height:0}.pos-panel{background:#fff;border-radius:var(--radius-lg);padding:15px;box-shadow:var(--shadow-sm)}.pos-cart{flex:1;min-height:0;display:flex;flex-direction:column}.pos-cart table{width:100%;border-collapse:collapse;font:400 14px/20px var(--font-body)}.pos-cart th{text-align:left;font:700 12px/16px var(--font-body);letter-spacing:.05em;text-transform:uppercase;color:var(--text-2);padding:10px 6px;border-bottom:1px solid var(--border)}.pos-cart td{padding:12px 6px;border-bottom:1px solid var(--border);vertical-align:middle}.pos-step{display:inline-flex;align-items:center;gap:8px}.pos-step button{width:30px;height:30px;border:0;border-radius:8px;background:var(--primary-100);color:var(--primary-700);font:700 16px/1 var(--font-body);cursor:pointer}.pos-step button:hover{background:var(--primary-200)}.pos-chips{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}.pos-chip{border:0;border-radius:var(--radius-md);padding:0 28px;height:48px;background:var(--neutral-100);color:var(--text-1);font:600 15px/1 var(--font-body);cursor:pointer}.pos-chip:hover{background:var(--neutral-200)}.pos-chip[aria-pressed="true"]{background:var(--primary-600);color:#fff}.pos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(188px,1fr));gap:14px;margin-top:16px}.pos-card{position:relative;text-align:left;border:1px solid var(--border);border-radius:var(--radius-md);background:#fff;padding:0 0 12px;cursor:pointer;font-family:var(--font-body);box-shadow:var(--shadow-sm);transition:box-shadow .12s,border-color .12s}.pos-card:hover{box-shadow:var(--shadow-md)}.pos-card[aria-pressed="true"]{border-color:var(--primary-600);box-shadow:0 0 0 1px var(--primary-600)}.pos-card .sp-thumb{width:124px;height:124px;margin:26px auto 10px;border-radius:var(--radius-md)}.pos-tag{position:absolute;top:0;font:600 12px/1 var(--font-body);padding:5px 7px;color:#fff}.pos-card .nm{padding:0 12px;font:600 15px/20px var(--font-body);color:var(--text-1)}.pos-card .cd{padding:2px 12px 0;font:400 13px/18px var(--font-body);color:var(--text-3)}.pos-tool{width:clamp(52px,4.6vw,75px);height:clamp(52px,4.6vw,75px);flex:none;border:0;border-radius:var(--radius-lg);color:#fff;cursor:pointer;display:grid;place-items:center;position:relative;transition:filter .12s}.pos-tool:hover{filter:brightness(.93)}.pos-big{height:58px;font-size:16px;flex:1}.pos-sum{text-align:right;color:var(--text-2);font:600 20px/28px var(--font-body)}.pos-sum b{color:var(--text-1);font-weight:700}.pos-bar{flex-wrap:wrap}.pos-search{min-width:min(100%,220px)}.pos-cart table th,.pos-cart table td{white-space:nowrap}.pos-cart td:first-child{white-space:normal}.pos-cart td:first-child>div{max-width:clamp(120px,18vw,190px)!important}@media(max-width:1099px){.pos{grid-template-columns:minmax(0,1fr);height:auto;min-height:100vh}.pos-col>.pos-panel{overflow:visible!important}.pos-col>.pos-panel:not(.pos-cart){flex:none!important}.pos-cart>div:first-child{max-height:50vh;overflow:auto!important}.pos-cart table{min-width:460px}.pos-tool{width:56px;height:56px}.pos-step button{width:44px;height:44px}}@media(max-width:767px){.pos{padding:10px;gap:10px}.pos-col{gap:10px}.pos-panel{padding:12px}.pos-top,.pos-calc,.pos-pay{grid-template-columns:minmax(0,1fr)!important;gap:12px!important}.pos-top .pos-panel{height:64px!important}.pos-search{flex:1 1 100%!important;height:64px!important;padding:0 12px!important}.pos-bar{gap:10px}.pos-tool{width:calc((100% - 30px)/4);max-width:64px;height:48px;border-radius:var(--radius-md);flex:1 1 44px}.pos-tool .sp-icon{width:24px!important;height:24px!important}.pos-chip{padding:0 16px;height:44px;font-size:14px}.pos-chips{gap:8px}.pos-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}.pos-card .sp-thumb{width:96px;height:96px}.pos-step button{width:44px;height:44px}.pos-acts{flex-wrap:wrap}.pos-big{min-width:100px;height:52px;font-size:15px}.pos-sum{text-align:left;font-size:18px}.pos-cart table{min-width:420px}}</style></head><body><div id="r"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="_ds_bundle.js"></script>
<script type="text/babel" src="lock.jsx"></script><script type="text/babel">const egp=n=>"EGP "+(+n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});const {Button,Icon,Select,Input,Badge,Modal,Field,ConfirmDeleteModal}=window.Industry_indust;
const CATS=["Glow","Skin Care","Hair Care"],BRANDS=["GG","Sontic"];
const PRODUCTS=[["001","FACE FAT AND DOUBLE CHIN",3490,2,"Glow","GG"],["003uc","ultrasonic scrubber",2990,7,"Skin Care","Sontic"],["001hs","intensive hair serum set",2490,94,"Hair Care","GG"],["005cp","collagen powder",1690,110,"Glow","Sontic"],["006lpc","lip care set",1790,100,"Skin Care","GG"]].map(p=>({code:p[0],name:p[1],price:p[2],stock:p[3],cat:p[4],brand:p[5]}));
const m=n=>egp(n);
const T=({bg,onClick,title,children,badge})=><button type="button" className="pos-tool" title={title} aria-label={title} style={{background:bg}} onClick={onClick}>{children}{badge!=null&&<span style={{position:"absolute",top:-6,right:-6,minWidth:28,height:28,borderRadius:14,background:"var(--primary-600)",color:"#fff",font:"700 13px/28px var(--font-body)",textAlign:"center",border:"2px solid #fff"}}>{badge}</span>}</button>;
function Calculator({open,onClose}){const [cur,setCur]=React.useState("0"),[acc,setAcc]=React.useState(null),[op,setOp]=React.useState(null),[fresh,setFresh]=React.useState(false),[expr,setExpr]=React.useState("");
const calc=(a,b,o)=>o==="+"?a+b:o==="−"?a-b:o==="×"?a*b:b===0?NaN:a/b;const fmt=n=>isFinite(n)?String(+n.toFixed(10)):"Error";
const clear=()=>{setCur("0");setAcc(null);setOp(null);setFresh(false);setExpr("")};
const digit=d=>{if(cur==="Error"||fresh){setCur(d==="."?"0.":d);setFresh(false);return}if(d==="."&&cur.includes("."))return;setCur(cur==="0"&&d!=="."?d:cur+d)};
const operate=o=>{if(cur==="Error")return;const v=parseFloat(cur);if(acc!==null&&op&&!fresh){const r=calc(acc,v,op);setAcc(isFinite(r)?r:null);setCur(fmt(r));setExpr(fmt(r)+" "+o)}else{setAcc(v);setExpr(cur+" "+o)}setOp(o);setFresh(true)};
const equals=()=>{if(acc===null||!op||cur==="Error")return;const v=parseFloat(cur);setExpr(expr+" "+cur+" =");setCur(fmt(calc(acc,v,op)));setAcc(null);setOp(null);setFresh(true)};
const back=()=>{if(fresh||cur==="Error")return;setCur(cur.length>1?cur.slice(0,-1):"0")};
const pct=()=>{if(cur!=="Error")setCur(fmt(parseFloat(cur)/100))};const neg=()=>{if(cur!=="0"&&cur!=="Error")setCur(cur[0]==="-"?cur.slice(1):"-"+cur)};
React.useEffect(()=>{if(!open)return;const h=e=>{const k=e.key;if(/^[0-9.]$/.test(k))digit(k);else if(k==="+"||k==="-"||k==="*"||k==="/")operate({"+":"+","-":"−","*":"×","/":"÷"}[k]);else if(k==="Enter"||k==="="){e.preventDefault();equals()}else if(k==="Backspace")back();else if(k==="Escape")onClose();else if(k==="Delete"||k==="c"||k==="C")clear();else if(k==="%")pct();else return;};window.addEventListener("keydown",h);return()=>window.removeEventListener("keydown",h)});
const keys=[["C","fn",clear],["±","fn",neg],["%","fn",pct],["÷","op",()=>operate("÷")],["7"],["8"],["9"],["×","op",()=>operate("×")],["4"],["5"],["6"],["−","op",()=>operate("−")],["1"],["2"],["3"],["+","op",()=>operate("+")],["0","zero"],[".","d"],["=","eq",equals]];
return <Modal open={open} size="sm" title="Calculator" onClose={onClose} footer={<Button variant="secondary" onClick={onClose}>Close</Button>}><div style={{display:"flex",flexDirection:"column",gap:16}}><div style={{background:"var(--neutral-100)",borderRadius:"var(--radius-md)",padding:"12px 16px",textAlign:"right",minHeight:88,display:"flex",flexDirection:"column",justifyContent:"flex-end"}} aria-live="polite"><div style={{font:"400 14px/20px var(--font-body)",color:"var(--text-3)",minHeight:20}}>{expr}</div><div style={{font:"700 32px/40px var(--font-body)",color:"var(--text-1)",overflow:"hidden",textOverflow:"ellipsis"}}>{cur}</div></div>
<div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10}}>{keys.map(([l,t,fn])=><button key={l} type="button" onClick={fn||(()=>digit(l))} className="sp-btn" style={{height:56,gridColumn:t==="zero"?"span 2":undefined,font:"600 20px/1 var(--font-body)",background:t==="op"||t==="eq"?"var(--primary-600)":t==="fn"?"var(--primary-100)":"var(--neutral-100)",color:t==="op"||t==="eq"?"#fff":t==="fn"?"var(--primary-700)":"var(--text-1)",justifyContent:"center"}}>{l}</button>)}</div></div></Modal>}
function App(){
const [cart,setCart]=React.useState([{...PRODUCTS[2],qty:1},{...PRODUCTS[3],qty:1}]);
const [tax,setTax]=React.useState("");const [disc,setDisc]=React.useState("");const [ship,setShip]=React.useState("");
const [q,setQ]=React.useState("");const [cat,setCat]=React.useState("all");const [brand,setBrand]=React.useState("all");
const [calc,setCalc]=React.useState(false);const [fs,setFs]=React.useState(!!document.fullscreenElement);const [fsErr,setFsErr]=React.useState(false);
React.useEffect(()=>{const h=()=>setFs(!!document.fullscreenElement);document.addEventListener("fullscreenchange",h);return()=>document.removeEventListener("fullscreenchange",h)},[]);
const toggleFs=()=>{const d=document;if(d.fullscreenElement){d.exitFullscreen();return}const el=d.documentElement;if(!el.requestFullscreen||!d.fullscreenEnabled){setFsErr(true);return}el.requestFullscreen().catch(()=>setFsErr(true))};const [holds,setHolds]=React.useState([]);const [showHolds,setShowHolds]=React.useState(false);const [del,setDel]=React.useState(null);
const [pay,setPay]=React.useState(false);const lk=usePosLock({paused:pay});const [recv,setRecv]=React.useState("");const [ptype,setPtype]=React.useState("Cash");const [pstat,setPstat]=React.useState("Paid");const [perr,setPerr]=React.useState("");const [done,setDone]=React.useState(false);
const qty=cart.reduce((a,i)=>a+i.qty,0);const sub=cart.reduce((a,i)=>a+i.qty*i.price,0);
const d=+disc||0,s=+ship||0,tx=(sub-d)*(+tax||0)/100;const total=Math.max(0,sub-d+tx+s);
const add=p=>setCart(c=>{const f=c.find(i=>i.code===p.code);if(f)return c.map(i=>i.code===p.code?{...i,qty:Math.min(p.stock,i.qty+1)}:i);return[...c,{...p,qty:1}]});
const step=(code,n)=>setCart(cart.map(i=>i.code===code?{...i,qty:Math.max(1,Math.min(i.stock,i.qty+n))}:i));
const reset=()=>{setCart([]);setTax("");setDisc("");setShip("")};
const hold=()=>{if(!cart.length)return;setHolds([...holds,{id:Date.now(),cart,total}]);reset()};
const resume=h=>{setCart(h.cart);setHolds(holds.filter(x=>x.id!==h.id));setShowHolds(false)};
const openPay=()=>{if(!cart.length)return;setRecv(total.toFixed(2));setPerr("");setPay(true)};
const submit=()=>{if((+recv||0)<total&&pstat==="Paid"){setPerr("Received amount is less than the total");return}setPay(false);reset();setDone(true)};
const list=PRODUCTS.filter(p=>(p.code+p.name).toLowerCase().includes(q.toLowerCase())&&(cat==="all"||p.cat===cat)&&(brand==="all"||p.brand===brand));const clear=()=>{setQ("");setCat("all");setBrand("all")};
return <div className="pos">
<div className="pos-col">
<div className="pos-top" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:15}}>
<div className="pos-panel" style={{display:"flex",padding:0,overflow:"hidden",height:74}}><div style={{flex:1,display:"flex",alignItems:"center",gap:10,padding:"0 16px"}}><Icon name="user" size={20}/><div style={{flex:1}}><Select defaultValue="direct-customer" options={["direct-customer"]} style={{border:0,padding:0,boxShadow:"none",fontSize:16}}/></div></div><button type="button" aria-label="Add customer" onClick={()=>location.href="Create Customer.html"} style={{width:84,border:0,background:"var(--primary-600)",color:"#fff",cursor:"pointer"}}><Icon name="user-plus" size={22}/></button></div>
<div className="pos-panel" style={{display:"flex",alignItems:"center",gap:10,height:74}}><Icon name="house" size={20}/><div style={{flex:1}}><Select defaultValue="Office" options={["Office"]} style={{border:0,padding:0,boxShadow:"none",fontSize:16}}/></div></div></div>
<div className="pos-panel pos-cart">
<div style={{flex:1,overflow:"auto"}}><table><thead><tr><th>Product</th><th>Qty</th><th>Price</th><th>Sub Total</th><th/></tr></thead><tbody>
{cart.length===0&&<tr><td colSpan="5" style={{color:"var(--text-3)",textAlign:"center",padding:40}}>Scan or select a product to start</td></tr>}
{cart.map(i=><tr key={i.code}><td><div style={{font:"600 15px/20px var(--font-body)",maxWidth:190,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{i.name}</div><Badge tone="info" dot={false}>{i.code}</Badge></td><td><span className="pos-step"><button type="button" aria-label="Decrease" onClick={()=>step(i.code,-1)}>−</button><b style={{fontWeight:600,minWidth:14,textAlign:"center"}}>{i.qty}</b><button type="button" aria-label="Increase" onClick={()=>step(i.code,1)}>+</button></span></td><td>{m(i.price)}</td><td>{m(i.price*i.qty)}</td><td><Button variant="ghost" size="sm" iconOnly icon="trash-2" aria-label="Remove" style={{color:"var(--danger-500)"}} onClick={()=>setDel(i)}/></td></tr>)}</tbody></table></div>
<div className="pos-calc" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,alignItems:"end",paddingTop:16}}>
<div style={{display:"flex",flexDirection:"column",gap:10}}><Input addon="%" placeholder="Tax" value={tax} onChange={e=>setTax(e.target.value)}/><Input addon="EGP" placeholder="Discount" value={disc} onChange={e=>setDisc(e.target.value)}/><Input addon="EGP" placeholder="Shipping" value={ship} onChange={e=>setShip(e.target.value)}/></div>
<div className="pos-sum"><div>Total QTY : <b>{qty}</b></div><div>Sub Total : <b>{m(sub)}</b></div><div style={{fontSize:26,marginTop:6}}>Total : <b>{m(total)}</b></div></div></div>
<div className="pos-acts" style={{display:"flex",gap:10,marginTop:16}}><button type="button" className="sp-btn pos-big" style={{background:"var(--tone-rose)",color:"#fff"}} onClick={hold}><Icon name="hand"/>Hold</button><button type="button" className="sp-btn pos-big" style={{background:"var(--danger-500)",color:"#fff"}} onClick={reset}><Icon name="rotate-cw"/>Reset</button><button type="button" className="sp-btn pos-big" style={{background:"var(--tone-green)",color:"#fff"}} onClick={openPay}><Icon name="banknote"/>Pay Now</button></div>
</div></div>
<div className="pos-col">
<div className="pos-bar" style={{display:"flex",gap:15}}><div className="pos-panel pos-search" style={{flex:1,display:"flex",alignItems:"center",height:75,padding:"0 20px"}}><Input icon="search" placeholder="Scan/Search Product by Code Name" value={q} onChange={e=>setQ(e.target.value)} style={{border:0,boxShadow:"none",height:50,fontSize:17}}/></div>
<T bg="var(--tone-rose)" title="Held orders" badge={holds.length} onClick={()=>setShowHolds(true)}><Icon name="list" size={30}/></T><T bg="var(--tone-green)" title="Register details"><Icon name="briefcase" size={30}/></T><T bg="var(--primary-600)" title={fs?"Exit fullscreen":"Fullscreen"} onClick={toggleFs}><Icon name={fs?"minimize":"maximize"} size={30}/></T><T bg="var(--primary-600)" title="Calculator" onClick={()=>setCalc(true)}><Icon name="calculator" size={30}/></T><T bg="var(--primary-600)" title="Lock Screen" onClick={lk.lockNow}><Icon name="lock" size={30}/></T><T bg="var(--primary-600)" title="Lock Settings" onClick={lk.openSettings}><Icon name="shield-check" size={30}/></T><T bg="var(--primary-600)" title="Dashboard" onClick={()=>location.href="Dashboard.html"}><Icon name="gauge" size={30}/></T></div>
<div className="pos-panel" style={{flex:1,minHeight:0,overflow:"auto"}}>
<div className="pos-chips"><button type="button" className="pos-chip" aria-pressed={cat==="all"} onClick={()=>setCat("all")}>All Categories</button>{CATS.map(c=><button key={c} type="button" className="pos-chip" aria-pressed={cat===c} onClick={()=>setCat(c)}>{c}</button>)}</div>
<div className="pos-chips"><button type="button" className="pos-chip" aria-pressed={brand==="all"} onClick={()=>setBrand("all")}>All Brands</button>{BRANDS.map(b=><button key={b} type="button" className="pos-chip" aria-pressed={brand===b} onClick={()=>setBrand(b)}>{b}</button>)}</div>
<div className="pos-grid">{list.map(p=><button key={p.code} type="button" className="pos-card" aria-pressed={!!cart.find(i=>i.code===p.code)} onClick={()=>add(p)}><span className="pos-tag" style={{left:0,background:"var(--tone-blue)",borderRadius:"6px 0 6px 0"}}>{m(p.price)}</span><span className="pos-tag" style={{right:0,background:"var(--tone-cyan)",borderRadius:"0 6px 0 6px"}}>{p.stock} piece</span><span className="sp-thumb"/><div className="nm">{p.name}</div><div className="cd">{p.code}</div></button>)}</div>
{list.length===0&&<div style={{color:"var(--text-3)",padding:24,display:"flex",alignItems:"center",gap:16}}>No products match the current search and filters.<Button variant="secondary" size="sm" onClick={clear}>Clear filters</Button></div>}
</div></div>
<ConfirmDeleteModal open={!!del} itemType="item" itemName={del?del.name:undefined} onCancel={()=>setDel(null)} onConfirm={()=>{setCart(cart.filter(x=>x.code!==del.code));setDel(null)}}/>
<Modal open={fsErr} size="sm" title="Fullscreen blocked" onClose={()=>setFsErr(false)} footer={<><Button variant="secondary" onClick={()=>setFsErr(false)}>Close</Button><Button icon="external-link" onClick={()=>{window.open(location.href,"_blank");setFsErr(false)}}>Open in new tab</Button></>}><p className="t-body" style={{margin:0}}>This preview does not allow fullscreen. Open POS in its own tab, then use the fullscreen button.</p></Modal>
{lk.node}
<Calculator open={calc} onClose={()=>setCalc(false)}/>
<Modal open={showHolds} size="md" title="Held Orders" onClose={()=>setShowHolds(false)} footer={<Button variant="secondary" onClick={()=>setShowHolds(false)}>Close</Button>}>{holds.length===0?<div style={{color:"var(--text-3)"}}>No held orders.</div>:holds.map((h,i)=><div key={h.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 0",borderBottom:"1px solid var(--border)"}}><span><b style={{fontWeight:600}}>Order #{i+1}</b> · {h.cart.length} items · {m(h.total)}</span><Button size="sm" onClick={()=>resume(h)}>Resume</Button></div>)}</Modal>
<Modal open={pay} size="lg" title="Make Payment" onClose={()=>setPay(false)} footer={<><Button variant="secondary" onClick={()=>setPay(false)}>Cancel</Button><Button onClick={submit}>Submit</Button></>}>
<div className="pos-pay" style={{display:"grid",gridTemplateColumns:"minmax(0,1.6fr) minmax(0,1fr)",gap:32}}>
<div className="sp-form-grid"><Field label="Received Amount" error={perr}><Input value={recv} onChange={e=>{setRecv(e.target.value);setPerr("")}}/></Field><Field label="Paying Amount"><Input disabled value={total.toFixed(2)}/></Field>
<Field label="Change Return"><Input disabled value={Math.max(0,(+recv||0)-total).toFixed(2)}/></Field><Field label="Payment Type"><Select value={ptype} onChange={e=>setPtype(e.target.value)} options={["Cash","Card","Cheque","Bank Transfer"]}/></Field>
<Field label="Notes" className="sp-span-all"><textarea className="sp-textarea" placeholder="Enter Notes"/></Field>
<Field label="Payment Status" required className="sp-span-all"><Select value={pstat} onChange={e=>setPstat(e.target.value)} options={["Paid","Unpaid","Partial"]}/></Field></div>
<div className="sp-card" style={{alignSelf:"start"}}>{[["Total Products",<Badge tone="primary" dot={false}>{cart.length}</Badge>],["Total Amount",m(sub)],["Order Tax",m(tx)+" ("+(+tax||0).toFixed(2)+" %)"],["Discount",m(d)],["Shipping",m(s)],["Grand Total",<b style={{fontWeight:700}}>{m(total)}</b>]].map(([k,v])=><div key={k} style={{display:"flex",justifyContent:"space-between",padding:"14px 20px",borderBottom:"1px solid var(--border)",font:"400 14px/20px var(--font-body)"}}><span style={{color:"var(--text-2)"}}>{k}</span><span>{v}</span></div>)}</div></div></Modal>
<Modal open={done} size="sm" title="Payment Complete" onClose={()=>setDone(false)} footer={<Button onClick={()=>setDone(false)}>New Sale</Button>}><p className="t-body" style={{margin:0}}>The sale was recorded and the cart has been cleared.</p></Modal>
</div>}
ReactDOM.createRoot(document.getElementById("r")).render(<App/>);</script></body></html>
