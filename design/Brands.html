<!DOCTYPE html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Brands · Sontic Plus</title><link rel="stylesheet" href="styles.css"><script src="theme.js"></script></head><body><div id="r"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="nav.js"></script><script src="_ds_bundle.js"></script>
<script type="text/babel">const {AppShell,TableToolbar,DataTable,Pagination,Modal,Field,Input,Button,ConfirmDeleteModal}=window.Industry_indust;
function App(){const [del,setDel]=React.useState(null);
const [rows,setRows]=React.useState([{id:1,name:"GG"}]);
const [logo,setLogo]=React.useState("");const fileRef=React.useRef(null);const pick=e=>{const fl=e.target.files&&e.target.files[0];if(!fl)return;if(!/^image\//.test(fl.type)){setErr("Choose an image file");return}if(fl.size>2*1024*1024){setErr("Image must be 2 MB or smaller");return}const rd=new FileReader();rd.onload=()=>{setLogo(rd.result);setErr("")};rd.readAsDataURL(fl);e.target.value=""};const [m,setM]=React.useState(null);const [name,setName]=React.useState("");const [err,setErr]=React.useState("");
const open=r=>{setM(r||{});setName(r?r.name:"");setLogo(r&&r.logo?r.logo:"");setErr("")};
const close=()=>setM(null);
const save=()=>{if(!name.trim()){setErr("Name is required");return}
 setRows(m.id?rows.map(x=>x.id===m.id?{...x,name,logo}:x):[...rows,{id:Date.now(),name,logo}]);close()};
return <AppShell items={SP_NAV} activeId="p3" title="Brands" userName="admin" userRole="Administrator" footer="All Rights Reserved © 2026 Sontic Plus">
<TableToolbar><Button icon="plus" onClick={()=>open()}>Create Brand</Button></TableToolbar>
<DataTable columns={[{key:"img",header:"Brand",render:(v,r)=><span style={{display:"flex",alignItems:"center",gap:16}}>{r.logo?<img src={r.logo} alt="" className="sp-thumb" style={{objectFit:"cover"}}/>:<span className="sp-thumb"/>}<span style={{fontWeight:600}}>{r.name}</span></span>}]} rows={rows} actions={r=>[{label:"Edit",icon:"pencil",onClick:()=>open(r)},"-",{label:"Delete",icon:"trash-2",danger:true,onClick:()=>setDel(r)}]}><Pagination page={1} pageSize={10} total={rows.length}/></DataTable>
<Modal open={!!m} size="sm" title={m&&m.id?"Edit Brand":"Create Brand"} onClose={close} footer={<><Button variant="secondary" onClick={close}>Cancel</Button><Button onClick={save}>Save</Button></>}>
<div style={{display:"flex",flexDirection:"column",gap:20}}>
<Field label="Name" required error={err&&!/image|MB/.test(err)?err:undefined}><Input placeholder="Enter Name" value={name} onChange={e=>{setName(e.target.value);setErr("")}} autoFocus/></Field>
<Field label="Change Logo" error={err&&/image|MB/.test(err)?err:undefined}><div style={{display:"flex",alignItems:"center",gap:16}}><div style={{position:"relative",width:120}}>{logo?<img src={logo} alt="Logo preview" style={{width:120,height:120,borderRadius:12,objectFit:"cover",display:"block"}}/>:<span className="sp-thumb" style={{width:120,height:120,borderRadius:12}}/>}<Button variant="secondary" size="sm" iconOnly icon="pencil" aria-label="Change logo" style={{position:"absolute",top:-8,right:-8,borderRadius:"50%"}} onClick={()=>fileRef.current&&fileRef.current.click()}/></div><div style={{display:"flex",flexDirection:"column",gap:8}}><Button variant="secondary" size="sm" icon="upload" onClick={()=>fileRef.current&&fileRef.current.click()}>Choose image</Button>{logo&&<Button variant="ghost" size="sm" icon="trash-2" onClick={()=>setLogo("")}>Remove</Button>}<span className="t-caption">PNG or JPG, up to 2 MB</span></div><input ref={fileRef} type="file" accept="image/*" onChange={pick} style={{display:"none"}}/></div></Field>
</div></Modal><ConfirmDeleteModal open={!!del} itemType="brand" itemName={del?del.name:undefined} onCancel={()=>setDel(null)} onConfirm={()=>{setRows(rows.filter(x=>x.id!==del.id));setDel(null)}}/></AppShell>}
ReactDOM.createRoot(document.getElementById("r")).render(<App/>);</script></body></html>
