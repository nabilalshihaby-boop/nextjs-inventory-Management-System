<!DOCTYPE html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Top Selling Products Reports · Sontic Plus</title><link rel="stylesheet" href="styles.css"><script src="theme.js"></script></head><body><div id="r"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="nav.js"></script><script src="tabs.js"></script><script src="_ds_bundle.js"></script>
<script type="text/babel">const egp=n=>"EGP "+(+n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});const {AppShell,StatCard,Tabs,TableToolbar,DataTable,Pagination,Badge,Button,Field,Select,Input}=window.Industry_indust;

const WH=({v,set,opts})=><div style={{width:420,margin:"0 auto 24px"}}><Field label="Warehouse"><Select value={v} onChange={e=>set(e.target.value)} options={opts}/></Field></div>;
const sale=[["SA_11149","71800.00"],["SA_11148","31920.00"],["SA_11147","7980.00"],["SA_11146","11970.00"],["SA_11145","7980.00"],["SA_11144","7480.00"],["SA_11143","11970.00"],["SA_11142","11470.00"],["SA_11141","11970.00"],["SA_11140","11970.00"]].map((r,i)=>({id:i,ref:r[0],total:egp(r[1]),paid:egp(r[1]),due:"EGP 0.00"}));
const code=v=><span className="sp-code">{v}</span>;
const T=[["002","ipl laser hair removal",3990,108,430920],["001","FACE FAT AND DOUBLE CHIN",3490,108,376920],["003uc","ultrasonic scrubber",2990,30,89700],["001hs","intensive hair serum set",2490,6,14940]].map((r,i)=>({id:i,code:r[0],name:r[1],price:egp(r[2]),qty:r[3],total:egp(r[4])}));
function App(){return shell("top",<><TableToolbar><Button icon="file-spreadsheet">EXCEL</Button><div style={{width:240}}><Input type="date" aria-label="Select Date"/></div></TableToolbar>
<DataTable columns={[{key:"code",header:"Code",render:code},{key:"name",header:"Product",primary:true},{key:"price",header:"Price",align:"right"},{key:"qty",header:"Quantity",render:v=><span style={{display:"flex",gap:6}}><Badge tone="danger" dot={false}>{v}</Badge><Badge tone="info" dot={false}>pic</Badge></span>},{key:"total",header:"Grand Total",align:"right"}]} rows={T}><Pagination page={1} pageSize={10} total={T.length}/></DataTable></>)}
ReactDOM.createRoot(document.getElementById("r")).render(<App/>);</script></body></html>
