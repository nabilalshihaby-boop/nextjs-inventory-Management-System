<!DOCTYPE html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Sign In · Sontic Plus</title><link rel="stylesheet" href="styles.css"><script src="theme.js"></script><style>.si{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:100vh}.si-brand{background:var(--primary-700);color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:56px 64px}.si-brand h2{font:800 56px/1.05 var(--font-display);letter-spacing:-.03em;margin:0;max-width:520px}.si-brand p{font:400 18px/28px var(--font-body);margin:20px 0 0;max-width:460px;color:var(--primary-100)}.si-form{display:flex;align-items:center;justify-content:center;padding:48px;background:var(--bg-surface)}.si-box{width:100%;max-width:420px;display:flex;flex-direction:column;gap:24px}.si-pw{position:relative}.si-eye{position:absolute;right:6px;top:4px}@media(max-width:767px){.si{grid-template-columns:minmax(0,1fr);min-height:100vh}.si-brand{padding:28px 24px;gap:20px}.si-brand h2{font-size:34px}.si-brand p{font-size:16px;line-height:24px;margin-top:12px}.si-form{padding:28px 20px}}@media(min-width:768px) and (max-width:1279px){.si-brand{padding:40px 32px}.si-brand h2{font-size:40px}.si-form{padding:32px}}</style></head><body><div id="r"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds_bundle.js"></script>
<script type="text/babel">const {Field,Input,Button,Checkbox,Icon}=window.Industry_indust;
function App(){const [fp,setFp]=React.useState(false);const [f,setF]=React.useState({email:"",pw:""});const [show,setShow]=React.useState(false);const [e,setE]=React.useState({});const [busy,setBusy]=React.useState(false);
const set=k=>ev=>{setF({...f,[k]:ev.target.value});setE({...e,[k]:"",form:""})};
const go=()=>{setBusy(true);setTimeout(()=>{location.href="Dashboard.html"},500)};
const submit=ev=>{ev.preventDefault();const n={};if(!f.email.trim())n.email="Email is required";if(!f.pw)n.pw="Password is required";if(Object.keys(n).length){setE(n);return}setE({});go()};
return <div className="si"><div className="si-brand"><div style={{font:"800 26px/1 var(--font-display)",letterSpacing:"-.02em"}}>Sontic Plus</div><div><h2>Inventory and point of sale in one place.</h2><p>Track stock across warehouses, record sales and purchases, and run the register.</p></div><div style={{font:"400 13px/18px var(--font-body)",color:"var(--primary-200)"}}>© 2026 Sontic Plus</div></div>
<div className="si-form"><form className="si-box" onSubmit={submit} noValidate><div><h1 className="t-page-title" style={{margin:0}}>Sign in</h1><p className="t-body" style={{margin:"8px 0 0",color:"var(--text-2)"}}>Enter your account details to continue.</p></div>
{e.form&&<div className="sp-badge sp-badge--danger" role="alert" style={{height:"auto",padding:"10px 14px",whiteSpace:"normal"}}><Icon name="circle-alert" size={16}/>{e.form}</div>}
<Field label="Email" required error={e.email}><Input type="text" icon="mail" placeholder="Enter Email" value={f.email} onChange={set("email")} autoFocus/></Field>
<Field label="Password" required error={e.pw}><div className="si-pw"><Input type={show?"text":"password"} icon="lock" placeholder="Enter Password" value={f.pw} onChange={set("pw")}/><span className="si-eye"><Button variant="ghost" size="sm" iconOnly icon={show?"eye-off":"eye"} aria-label={show?"Hide password":"Show password"} onClick={()=>setShow(!show)}/></span></div></Field>
<div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><Checkbox label="Remember me"/><a href="#" onClick={ev=>{ev.preventDefault();setFp(!fp)}} style={{font:"600 14px/20px var(--font-body)"}}>Forgot password?</a></div>
{fp&&<div className="sp-badge sp-badge--info" role="status" style={{height:"auto",padding:"10px 14px",whiteSpace:"normal"}}><Icon name="info" size={16}/>Password reset is not available in this demo.</div>}<Button size="lg" type="submit" disabled={busy} style={{width:"100%"}}>{busy?"Signing in…":"Sign In"}</Button></form></div></div>}
ReactDOM.createRoot(document.getElementById("r")).render(<App/>);</script></body></html>
