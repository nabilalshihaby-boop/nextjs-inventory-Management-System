<!DOCTYPE html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Create Supplier · Sontic Plus</title><link rel="stylesheet" href="styles.css"><script src="theme.js"></script></head><body><div id="r"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="nav.js"></script><script src="tabs.js"></script><script src="_ds_bundle.js"></script><script src="demo.js"></script><script type="text/babel" src="demo.jsx"></script>
<script type="text/babel">const {AppShell,PageHeader,FormCard,Field,Input,Button}=window.Industry_indust;
const P=new URLSearchParams(location.search);const editing=P.has("name");
function App(){const [f,setF]=React.useState({name:P.get("name")||"",email:P.get("email")||"",phone:P.get("phone")||"",country:"",city:"",address:""});const [e,setE]=React.useState({});
const set=k=>ev=>{setF({...f,[k]:ev.target.value});setE({...e,[k]:""})};
const ok=Object.values(f).every(v=>v.trim());
const save=()=>{const n={};if(!f.name.trim())n.name="Name is required";if(!/^\S+@\S+\.\S+$/.test(f.email))n.email="Enter a valid email";if(!f.phone.trim())n.phone="Phone number is required";if(!f.country.trim())n.country="Country is required";if(!f.city.trim())n.city="City is required";if(!f.address.trim())n.address="Address is required";setE(n);if(!Object.keys(n).length){if(!editing)DEMO.addSupplier(f);location.href="Suppliers.html"}};
const F=(k,l,ph)=><Field label={l} required error={e[k]}><Input placeholder={ph} value={f[k]} onChange={set(k)}/></Field>;
return <AppShell items={SP_NAV} activeId="pe1" title="Suppliers" userName="admin" userRole="Administrator" footer="All Rights Reserved © 2026 Sontic Plus">
<PageHeader title={editing?"Edit Supplier":"Create Supplier"}><Button variant="secondary" icon="arrow-left" onClick={()=>location.href="Suppliers.html"}>Back</Button></PageHeader>
<FormCard columns={2} saveDisabled={!ok} onSave={save} onCancel={()=>location.href="Suppliers.html"}>
{F("name","Name","Enter Name")}{F("email","Email","Enter Email")}{F("phone","Phone Number","Phone Number")}{F("country","Country","Enter Country")}{F("city","City","Enter City")}{F("address","Address","Enter Address")}
</FormCard></AppShell>}
ReactDOM.createRoot(document.getElementById("r")).render(<App/>);</script></body></html>
