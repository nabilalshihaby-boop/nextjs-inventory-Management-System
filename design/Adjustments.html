<!DOCTYPE html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Adjustments · Sontic Plus</title><link rel="stylesheet" href="styles.css"><script src="theme.js"></script></head><body><div id="r"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="nav.js"></script><script src="_ds_bundle.js"></script>
<script type="text/babel">const {AppShell,TableToolbar,DataTable,Pagination,Badge,Button,ConfirmDeleteModal}=window.Industry_indust;
const D0=[["AD_1101","Office","collagen powder","Addition",1,"27/05/2026"],["AD_1100","Office","ultrasonic scrubber","Subtraction",2,"20/05/2026"]].map((r,i)=>({id:i,ref:r[0],wh:r[1],product:r[2],type:r[3],qty:r[4],date:r[5]}));
function App(){const [rows,setRows]=React.useState(D0);const [q,setQ]=React.useState("");const [del,setDel]=React.useState(null);const v=rows.filter(r=>(r.ref+r.product).toLowerCase().includes(q.toLowerCase()));
const cols=[{key:"ref",header:"Reference",render:x=><span className="sp-code">{x}</span>},{key:"wh",header:"Warehouse"},{key:"product",header:"Product",primary:true},{key:"type",header:"Type",render:x=><Badge tone={x==="Addition"?"success":"danger"} dot={false}>{x}</Badge>},{key:"qty",header:"Quantity"},{key:"date",header:"Date",render:x=><Badge tone="info" dot={false}>{x}</Badge>},{key:"act",header:"Action",align:"right",render:(x,r)=><span style={{display:"flex",gap:2,justifyContent:"flex-end"}}><Button variant="ghost" size="sm" iconOnly icon="pencil" aria-label="Edit" style={{color:"var(--primary-600)"}} onClick={()=>location.href="Create Adjustment.html"}/><Button variant="ghost" size="sm" iconOnly icon="trash-2" aria-label="Delete" style={{color:"var(--danger-500)"}} onClick={()=>setDel(r)}/></span>}];
return <AppShell items={SP_NAV} activeId="adj" title="Adjustments" userName="admin" userRole="Administrator" footer="All Rights Reserved © 2026 Sontic Plus"><TableToolbar value={q} onSearch={setQ}><Button icon="plus" onClick={()=>location.href="Create Adjustment.html"}>Create Adjustment</Button></TableToolbar><DataTable columns={cols} rows={v}><Pagination page={1} pageSize={10} total={v.length}/></DataTable>
<ConfirmDeleteModal open={!!del} itemType="adjustment" itemName={del?del.ref:undefined} onCancel={()=>setDel(null)} onConfirm={()=>{setRows(rows.filter(y=>y.id!==del.id));setDel(null)}}/></AppShell>}
ReactDOM.createRoot(document.getElementById("r")).render(<App/>);</script></body></html>
