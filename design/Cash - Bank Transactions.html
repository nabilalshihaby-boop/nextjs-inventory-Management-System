<b>{view.kind==="D"?"Destination Account":"Source Account"}</b><span>{an(view.acct)}</span>{view.kind==="T"&&<><b>Destination Account</b><span>{an(view.to)}</span></>}
<b>Amount</b><span><b style={{color:view.kind==="D"?"var(--success-700,#15803d)":view.kind==="W"?"var(--danger-500)":"var(--primary-700)"}}>{egp(view.amount)}</b></span>
<b>Description</b><span>{view.desc}</span>{view.party&&<><b>{view.kind==="D"?"Customer":"Supplier"}</b><span>{view.party}</span></>}{view.inv&&<><b>{view.kind==="D"?"Related Sales Invoice":"Related Purchase Invoice"}</b><span className="sp-code" style={{justifySelf:"start"}}>{view.inv}</span></>}{view.method&&<><b>Payment Method</b><span>{view.method}</span></>}{view.purpose&&<><b>{view.kind==="D"?"Deposit Source":"Purpose"}</b><span>{view.purpose}</span></>}
<b>{view.kind==="T"?"Source Balance After":"Balance After"}</b><span>{egp(view.after)}</span>{view.kind==="T"&&<><b>Destination Balance After</b><span>{egp(view.toAfter)}</span></>}
<b>Status</b><span><Badge tone="success">{view.status}</Badge></span><b>Notes</b><span>{view.notes||"—"}</span></div>}</Modal>{toast}</AppShell>}
