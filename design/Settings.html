<!DOCTYPE html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Settings · Sontic Plus</title><link rel="stylesheet" href="styles.css"><script src="theme.js"></script></head><body><div id="r"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="nav.js"></script><script src="_ds_bundle.js"></script>
<script type="text/babel">const {AppShell,PageHeader,FormCard,Field,Input,Select,Textarea,Switch,Checkbox,Button,Icon}=window.Industry_indust;
const TABS=[{id:"settings",label:"Settings",href:"Settings.html"}];
function App(){
const [f,setF]=React.useState({currency:"EGP",email:"support@sonticplus.com",right:false,name:"Sontic Plus",phone:"01708750611",dev:"",footer:"© 2026 Sontic Plus. All rights reserved.",customer:"direct-customer",wh:"Office",country:"Bangladesh",state:"Dhaka",city:"Uttara",postal:"10001",date:"DD/MM/YYYY",address:"Sector: 10, Road: 06, Uttara, Dhaka, Bangladesh.",ver:false});
const [e,setE]=React.useState({});const [msg,setMsg]=React.useState("");const [logo,setLogo]=React.useState(null);const fileRef=React.useRef(null);
const set=k=>ev=>{setF({...f,[k]:ev.target.value});setE({...e,[k]:""});setMsg("")};
const save=()=>{const n={};if(!f.name.trim())n.name="Company name is required";if(f.email&&!/^\S+@\S+\.\S+$/.test(f.email))n.email="Enter a valid email";if(!f.state.trim())n.state="State is required";setE(n);setMsg(Object.keys(n).length?"":"Settings saved")};
const sel=(k,l,opts,req)=><Field label={l} required={req}><Select value={f[k]} onChange={set(k)} options={opts}/></Field>;
return <AppShell items={SP_NAV} activeId="se" title="Settings" userName="admin" userRole="Administrator" footer="All Rights Reserved © 2026 Sontic Plus">
<PageHeader title="System Settings"/>
<FormCard columns={2} onSave={save} onCancel={()=>location.reload()} saveLabel="Save" cancelLabel="Reset">
{sel("currency","Default Currency",["EGP","$","€"],true)}
<Field label="Default Email" error={e.email}><Input value={f.email} onChange={set("email")}/></Field>
<div className="sp-span-all"><Switch label="Currency icon Right side" checked={f.right} onChange={ev=>setF({...f,right:ev.target.checked})}/></div>
<Field label="Change Logo"><div style={{position:"relative",width:100}}><span className="sp-avatar" style={{width:100,height:100,borderRadius:16,overflow:"hidden",fontSize:34}}>{logo?<img src={logo} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>:"S+"}</span><Button variant="secondary" size="sm" iconOnly icon="pencil" aria-label="Change logo" style={{position:"absolute",top:-6,right:-6,borderRadius:"50%"}} onClick={()=>fileRef.current.click()}/><input ref={fileRef} type="file" accept="image/*" hidden onChange={ev=>{const x=ev.target.files[0];if(x)setLogo(URL.createObjectURL(x))}}/></div></Field>
<Field label="Company Name" error={e.name}><Input value={f.name} onChange={set("name")}/></Field>
<Field label="Company Phone"><Input value={f.phone} onChange={set("phone")}/></Field>
<Field label="Developed By"><Input placeholder="Enter Developer Name" value={f.dev} onChange={set("dev")}/></Field>
<Field label="Footer"><Input value={f.footer} onChange={set("footer")}/></Field>
{sel("customer","Default Customer",["direct-customer"],true)}
{sel("wh","Default Warehouse",["Office"],true)}
{sel("country","Country",["Bangladesh"],true)}
<Field label="State" required error={e.state}><Input value={f.state} onChange={set("state")}/></Field>
<Field label="City"><Input value={f.city} onChange={set("city")}/></Field>
<Field label="Postal Code"><Input value={f.postal} onChange={set("postal")}/></Field>
{sel("date","Date Format",["DD/MM/YYYY","MM/DD/YYYY","YYYY-MM-DD"],true)}
<Field label="Address" className="sp-span-all"><Textarea rows={3} value={f.address} onChange={set("address")}/></Field>
<div className="sp-span-all"><Checkbox label="Show version number in footer" checked={f.ver} onChange={ev=>setF({...f,ver:ev.target.checked})}/></div>
</FormCard>
{msg&&<div className="sp-badge sp-badge--success" style={{marginTop:16}}><i/>{msg}</div>}
<h2 className="t-section-title" style={{margin:"32px 0 16px"}}>Appearance</h2>
<div className="sp-card" style={{padding:24,display:"flex",alignItems:"center",gap:16}}><Button variant="secondary" icon="palette" onClick={()=>location.href="Theme Settings.html"}>Theme Settings</Button><span className="t-caption">Customize theme colors, mode, sidebar style and border radius.</span></div>
<h2 className="t-section-title" style={{margin:"32px 0 16px"}}>Clear Cache</h2>
<div className="sp-card" style={{padding:24,display:"flex",alignItems:"center",gap:16}}><Button variant="secondary" icon="eraser" onClick={()=>setMsg("Cache cleared")}>Clear Cache</Button><span className="t-caption">Removes stored application data and reloads the latest settings.</span></div>
</AppShell>}
ReactDOM.createRoot(document.getElementById("r")).render(<App/>);</script></body></html>
