<!DOCTYPE html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Profit &amp; Loss · Sontic Plus</title><link rel="stylesheet" href="styles.css"><script src="theme.js"></script></head><body><div id="r"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script><script src="nav.js"></script><script src="tabs.js"></script><script src="_ds_bundle.js"></script><script src="demo.js"></script><script src="customer-data.js"></script><script type="text/babel" src="demo.jsx"></script>
<style>.sp-kpi-grid .sp-stat-value{font-size:22px}.pl-t{width:100%;border-collapse:collapse;font:400 14px/20px var(--font-body)}.pl-t td,.pl-t th{padding:12px 20px;border-bottom:1px solid var(--border)}.pl-t th{text-align:right;font:700 12px/16px var(--font-body);letter-spacing:.05em;text-transform:uppercase;color:var(--text-2);background:var(--neutral-100)}.pl-t th:first-child{text-align:left}.pl-t td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.pl-sec td{background:var(--primary-50);font-weight:700;color:var(--primary-700)}.pl-sec button{all:unset;display:flex;align-items:center;gap:8px;cursor:pointer}.pl-ind td:first-child{padding-left:48px;color:var(--text-2)}.pl-sub td{font-weight:700;background:var(--neutral-100)}.pl-net td{background:var(--primary-600);color:#fff;font:700 17px/24px var(--font-body);border-bottom:0}.pl-mg td{color:var(--text-3);font-size:13px;padding-top:8px;padding-bottom:8px}.pl-seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:var(--radius-md);overflow:hidden}.pl-seg button{border:0;background:#fff;padding:0 16px;height:36px;font:600 13px/1 var(--font-body);color:var(--text-2);cursor:pointer}.pl-seg button[aria-pressed="true"]{background:var(--primary-600);color:#fff}@media print{.pl-noprint{display:none!important}}</style>
<script type="text/babel">const egp=n=>"EGP "+(+n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});const fmt=n=>(n<0?"(":"")+egp(Math.abs(n)).replace("EGP ","EGP ")+(n<0?")":"");
const {AppShell,PageHeader,StatCard,Button,Field,Select,Input,Switch,Badge,Icon}=window.Industry_indust;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const mk=(gross,ret,cogs,e)=>({gross,ret,cogs,exp:{Rent:e[0],"Salaries & Wages":e[1],Utilities:e[2],Marketing:e[3],"Delivery & Logistics":e[4],"Other Operating Expenses":e[5]}});
const SETS={today:mk(32000,1500,21350,[1000,1500,270,400,550,180]),week:mk(215000,12000,142100,[7000,10500,1900,3000,3600,1200]),month:mk(900000,50000,595000,[30000,45000,8000,12000,15000,5000]),last:mk(820000,45000,542500,[30000,45000,7500,9000,13500,4500])};
const PREV={today:mk(28000,1000,18900,[900,1400,250,350,500,300]),week:mk(198000,11000,130900,[6800,10000,1800,2700,3400,1300]),month:SETS.last,last:mk(780000,40000,518000,[30000,44000,7200,8000,12500,4300])};
const LABEL={today:"Today",week:"This Week",month:"This Month",last:"Last Month",custom:"Custom Range"};
const calc=d=>{const net=d.gross-d.ret,gp=net-d.cogs,ox=Object.values(d.exp).reduce((a,b)=>a+b,0);return{...d,net,gp,ox,np:gp-ox,gm:gp/net*100,nm:(gp-ox)/net*100,or:ox/net*100}};
const scale=(d,k)=>{const r=v=>Math.round(v*k/10)*10;return mk(r(d.gross),r(d.ret),r(d.cogs),Object.values(d.exp).map(r))};
const MONTHS=[["Jan",690000,207000,98000],["Feb",705000,211500,104000],["Mar",740000,222000,116000],["Apr",775000,232500,123000],["May",850000,255000,140000]];
const COL=["--tone-teal","--tone-blue","--tone-amber","--tone-violet","--tone-green","--neutral-400"];
const pct=n=>n.toFixed(2).replace(/\.?0+$/,"")+"%";
const dl=(c,p,bad)=>{if(!p)return null;const v=(c-p)/Math.abs(p)*100;return{v,good:bad?v<=0:v>=0}};
function Cv({make,deps,h=300}){const r=React.useRef(null);React.useEffect(()=>{Chart.defaults.font.family=css("--font-body").replace(/"/g,"");Chart.defaults.color=css("--text-2");const c=new Chart(r.current,make());return()=>c.destroy()},deps);return <div style={{position:"relative",height:h}}><canvas ref={r}/></div>}
function App(){const [toast,setToast]=useToast();const [rng,setRng]=React.useState("month"),[cmp,setCmp]=React.useState(false),[cu,setCu]=React.useState({from:"2026-05-01",to:"2026-05-15"}),[cua,setCua]=React.useState(cu),[err,setErr]=React.useState("");
const [open,setOpen]=React.useState({rev:true,cogs:true,opx:true}),[months,setMonths]=React.useState(5),[busy,setBusy]=React.useState(null);
const days=Math.round((new Date(cua.to)-new Date(cua.from))/864e5)+1;const k=days/31;
const cur=calc(rng==="custom"?scale(SETS.month,k):SETS[rng]),prv=calc(rng==="custom"?scale(SETS.last,k):PREV[rng]);
const applyCu=()=>{if(!cu.from||!cu.to)return setErr("Select both dates");if(cu.from>cu.to)return setErr("From Date must be before To Date");if((new Date(cu.to)-new Date(cu.from))/864e5>366)return setErr("Choose a range of up to one year");setErr("");setCua(cu)};
const fake=(w,msg)=>{setBusy(w);setTimeout(()=>{setBusy(null);setToast(msg)},900)};
const kp=[["teal","shopping-cart","Net Sales",cur.net,prv.net,false],["blue","chart-column","Gross Profit",cur.gp,prv.gp,false],["amber","wallet","Operating Expenses",cur.ox,prv.ox,true],["green","circle-dollar-sign","Net Profit",cur.np,prv.np,false]];
const tg=k=>setOpen({...open,[k]:!open[k]});
const Row=({cls,label,v,p,bad,nsl,neg,pr})=>{const d=dl(v,p,bad);return <tr className={cls}><td>{label}</td><td className="n">{neg?"("+egp(Math.abs(v))+")":egp(v)}</td><td className="n" style={{opacity:.85}}>{nsl?(v/cur.net*100).toFixed(1)+"%":""}</td>{cmp&&<><td className="n">{neg?"("+egp(Math.abs(p))+")":egp(p)}</td><td className="n" style={{color:cls==="pl-net"?"#fff":d&&(d.good?"var(--success-700,#15803d)":"var(--danger-500)")}}>{d?(d.v>=0?"+":"")+d.v.toFixed(1)+"%":""}</td></>}</tr>};
const Sec=({id,label})=><tr className="pl-sec"><td colSpan={cmp?5:3}><button type="button" onClick={()=>tg(id)} aria-expanded={open[id]}><Icon name={open[id]?"chevron-down":"chevron-right"} size={16}/>{label}</button></td></tr>;
const ex=Object.entries(cur.exp),pe=prv.exp;
const order=[["Salaries & Wages","Salaries"],["Rent","Rent"],["Delivery & Logistics","Delivery & Logistics"],["Marketing","Marketing"],["Utilities","Utilities"],["Other Operating Expenses","Other Expenses"]];
const mm=MONTHS.slice(5-months);
return <AppShell items={SP_NAV} activeId="f3" title="Profit &amp; Loss" userName="admin" userRole="Administrator" footer="All Rights Reserved © 2026 Sontic Plus">
<PageHeader title="Profit &amp; Loss Report"><span className="pl-noprint" style={{display:"flex",gap:12,alignItems:"center",flexWrap:"wrap"}}><div style={{width:170}}><Select aria-label="Date range" value={rng} onChange={e=>setRng(e.target.value)} options={Object.entries(LABEL).map(([v,l])=>({value:v,label:l}))}/></div><Switch label="Compare with Previous Period" checked={cmp} onChange={e=>setCmp(e.target.checked)}/><Button variant="secondary" icon="printer" disabled={!!busy} onClick={()=>window.print()}>Print Report</Button><Button icon="file-down" disabled={!!busy} onClick={()=>fake("pdf","PDF export is a demonstration only")}>{busy==="pdf"?"Preparing…":"Export PDF"}</Button></span></PageHeader>
<p className="t-body" style={{margin:"-8px 0 24px",color:"var(--text-2)"}}>Track business revenue, merchandise costs, expenses, and profitability.</p>
{rng==="custom"&&<div className="sp-card pl-noprint" style={{padding:20,marginBottom:24}}><div style={{display:"grid",gridTemplateColumns:"repeat(2,minmax(0,240px)) auto",gap:20,alignItems:"end"}}><Field label="From Date"><Input type="date" value={cu.from} onChange={e=>setCu({...cu,from:e.target.value})}/></Field><Field label="To Date"><Input type="date" value={cu.to} onChange={e=>setCu({...cu,to:e.target.value})}/></Field><Button onClick={applyCu}>Apply</Button></div>{err&&<div className="sp-error" style={{marginTop:12}}>{err}</div>}<p className="t-caption" style={{margin:"12px 0 0"}}>Demonstration only: custom ranges show prorated sample figures ({days} {days===1?"day":"days"}).</p></div>}
<div className="sp-kpi-grid" style={{marginBottom:32}}>{kp.map(([t,i,l,v,p,bad])=>{const d=dl(v,p,bad);return <StatCard key={l} tone={t} icon={i} value={egp(v)} label={l} note={cmp&&d?(d.v>=0?"▲ ":"▼ ")+Math.abs(d.v).toFixed(1)+"% vs previous period":LABEL[rng]}/>})}</div>
<section className="sp-card" style={{marginBottom:32}}><div className="sp-card-head"><h2 className="t-section-title" style={{margin:0}}>Profit &amp; Loss Statement · {LABEL[rng]}</h2></div>
<table className="pl-t"><thead><tr><th>Account</th><th>Amount</th><th>% of Net Sales</th>{cmp&&<><th>Previous Period</th><th>Change</th></>}</tr></thead><tbody>
<Sec id="rev" label="Revenue"/>{open.rev&&<><Row cls="pl-ind" label="Gross Sales" v={cur.gross} p={prv.gross}/><Row cls="pl-ind" label="Sales Returns & Discounts" v={cur.ret} p={prv.ret} neg bad/></>}<Row cls="pl-sub" label="Net Sales" v={cur.net} p={prv.net} nsl/>
<Sec id="cogs" label="Cost of Goods Sold (COGS)"/>{open.cogs&&<Row cls="pl-ind" label="Cost of Goods Sold" v={cur.cogs} p={prv.cogs} bad/>}<Row cls="pl-sub" label="Gross Profit" v={cur.gp} p={prv.gp} nsl/><tr className="pl-mg"><td style={{paddingLeft:48}}>Gross Profit Margin</td><td className="n">{pct(cur.gm)}</td><td/>{cmp&&<><td className="n">{pct(prv.gm)}</td><td/></>}</tr>
<Sec id="opx" label="Operating Expenses"/>{open.opx&&ex.map(([n,v])=><Row key={n} cls="pl-ind" label={n} v={v} p={pe[n]} bad/>)}<Row cls="pl-sub" label="Total Operating Expenses" v={cur.ox} p={prv.ox} nsl bad/>
<Row cls="pl-net" label="Net Profit" v={cur.np} p={prv.np} nsl/><tr className="pl-mg"><td style={{paddingLeft:48}}>Net Profit Margin</td><td className="n">{pct(cur.nm)}</td><td/>{cmp&&<><td className="n">{pct(prv.nm)}</td><td/></>}</tr></tbody></table></section>
<div style={{display:"grid",gridTemplateColumns:"minmax(0,3fr) minmax(0,2fr)",gap:24,marginBottom:32}}>
<section className="sp-card"><div className="sp-card-head" style={{justifyContent:"space-between"}}><h2 className="t-section-title" style={{margin:0}}>Revenue &amp; Profit Trends</h2><span className="pl-seg pl-noprint">{[3,5].map(n=><button key={n} type="button" aria-pressed={months===n} onClick={()=>setMonths(n)}>{n} Months</button>)}</span></div><div style={{padding:24}}><Cv deps={[months]} make={()=>({type:"bar",data:{labels:mm.map(m=>m[0]+" 2026"),datasets:[{label:"Net Sales",data:mm.map(m=>m[1]),backgroundColor:css("--tone-teal"),borderRadius:4},{label:"Gross Profit",data:mm.map(m=>m[2]),backgroundColor:css("--tone-blue"),borderRadius:4},{label:"Net Profit",data:mm.map(m=>m[3]),backgroundColor:css("--tone-green"),borderRadius:4}]},options:{maintainAspectRatio:false,plugins:{legend:{position:"top"},tooltip:{callbacks:{label:c=>c.dataset.label+": "+egp(c.parsed.y)}}},scales:{y:{beginAtZero:true,ticks:{callback:v=>(v/1000)+"k"}}}}})}/></div></section>
<section className="sp-card"><div className="sp-card-head"><h2 className="t-section-title" style={{margin:0}}>Expense Breakdown</h2></div><div style={{padding:24,display:"flex",flexDirection:"column",gap:16}}><div><Cv h={200} deps={[rng,days]} make={()=>({type:"doughnut",data:{labels:order.map(o=>o[1]),datasets:[{data:order.map(o=>cur.exp[o[0]]),backgroundColor:COL.map(css),borderWidth:2,borderColor:"#fff"}]},options:{maintainAspectRatio:false,cutout:"62%",plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.label+": "+egp(c.parsed)}}}}})}/></div>
<div style={{display:"flex",flexDirection:"column",gap:8}}>{order.map((o,i)=><div key={o[0]} style={{display:"flex",alignItems:"center",gap:10,font:"400 14px/20px var(--font-body)"}}><span style={{width:12,height:12,borderRadius:3,background:"var(--"+COL[i].slice(2)+")",flex:"none"}}/><span style={{flex:1}}>{o[1]}</span><span style={{color:"var(--text-2)"}}>{egp(cur.exp[o[0]])}</span><b style={{width:52,textAlign:"right"}}>{(cur.exp[o[0]]/cur.ox*100).toFixed(1)}%</b></div>)}</div></div></section></div>
<h2 className="t-section-title" style={{margin:"0 0 16px"}}>Business Performance Insights</h2>
<div className="sp-kpi-grid" style={{gridTemplateColumns:"repeat(3,minmax(0,1fr))"}}>{[["Gross Profit Margin",pct(cur.gm),"Gross Profit / Net Sales"],["Net Profit Margin",pct(cur.nm),"Net Profit / Net Sales"],["Operating Expenses / Net Sales",pct(cur.or),"Operating Expenses / Net Sales"]].map(([l,v,f])=><div key={l} className="sp-card" style={{padding:20}}><div className="t-caption">{l}</div><div style={{font:"700 28px/36px var(--font-body)",margin:"6px 0",color:"var(--primary-700)"}}>{v}</div><div className="t-caption">{f}</div></div>)}</div>
<p className="t-caption" style={{marginTop:16}}>Sample data for demonstration. Net Sales = Gross Sales − Returns &amp; Discounts. Gross Profit = Net Sales − COGS. Net Profit = Gross Profit − Operating Expenses. Customer collections, supplier payments and internal transfers are not part of this statement.</p>{toast}</AppShell>}
ReactDOM.createRoot(document.getElementById("r")).render(<App/>);</script></body></html>
