<!DOCTYPE html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Customers · Sontic Plus</title><link rel="stylesheet" href="styles.css"><script src="theme.js"></script></head><body><div id="r"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="nav.js"></script><script src="_ds_bundle.js"></script>
<script type="text/babel">const {AppShell,TableToolbar,DataTable,Pagination,Badge,Button,ConfirmDeleteModal}=window.Industry_indust;
const Act=({onEdit,onDel})=><span style={{display:"flex",gap:2,justifyContent:"flex-end"}}><Button variant="ghost" size="sm" iconOnly icon="pencil" aria-label="Edit" style={{color:"var(--primary-600)"}} onClick={onEdit}/><Button variant="ghost" size="sm" iconOnly icon="trash-2" aria-label="Delete" style={{color:"var(--danger-500)"}} onClick={onDel}/></span>;
function App(){const [rows,setRows]=React.useState([{id:1,name:"direct-customer",email:"customer@sonticplus.com",phone:"123456789",at:"11:52 AM · 04/11/2023"}]);const [q,setQ]=React.useState("");const [del,setDel]=React.useState(null);
const v=rows.filter(r=>(r.name+r.email+r.phone).toLowerCase().includes(q.toLowerCase()));
const cols=[{key:"name",header:"Customer",render:(x,r)=><div style={{padding:"6px 0"}}><div style={{color:"var(--primary-700)",fontWeight:600}}>{r.name}</div><div style={{color:"var(--text-2)"}}>{r.email}</div></div>},{key:"phone",header:"Phone Number"},{key:"at",header:"Created On",render:x=><Badge tone="info" dot={false}>{x}</Badge>},{key:"act",header:"Action",align:"right",render:(x,r)=><Act onEdit={()=>location.href="Create Customer.html?"+new URLSearchParams({name:r.name,email:r.email,phone:r.phone})} onDel={()=>setDel(r)}/>}];
return <AppShell items={SP_NAV} activeId="pe2" title="Customers" userName="admin" userRole="Administrator" footer="All Rights Reserved © 2026 Sontic Plus">
<TableToolbar value={q} onSearch={setQ}><Button variant="secondary" icon="upload">Import Customers</Button><Button icon="plus" onClick={()=>location.href="Create Customer.html"}>Create Customer</Button></TableToolbar>
<DataTable columns={cols} rows={v}><Pagination page={1} pageSize={10} total={v.length}/></DataTable>
<ConfirmDeleteModal open={!!del} itemType="customer" itemName={del?del.name:undefined} onCancel={()=>setDel(null)} onConfirm={()=>{setRows(rows.filter(y=>y.id!==del.id));setDel(null)}}/></AppShell>}
ReactDOM.createRoot(document.getElementById("r")).render(<App/>);</script></body></html>
