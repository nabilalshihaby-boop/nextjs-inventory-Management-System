<!DOCTYPE html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Transfers · Sontic Plus</title><link rel="stylesheet" href="styles.css"><script src="theme.js"></script><style>.sp-qty{display:inline-flex;align-items:stretch}.sp-qty .sp-btn{width:42px;padding:0;border-radius:var(--radius-md) 0 0 var(--radius-md)}.sp-qty .sp-btn:last-child{border-radius:0 var(--radius-md) var(--radius-md) 0}.sp-qty .sp-input{width:56px;text-align:center;padding:0;border-radius:0;border-left:0;border-right:0}.sp-sug{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-lg);padding:6px}.sp-sum{width:490px;margin-left:auto;border:1px solid var(--border);border-radius:var(--radius-md)}.sp-sum div{display:flex;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border);font:400 14px/20px var(--font-body)}.sp-sum div:last-child{border-bottom:0;color:var(--primary-700);font-weight:700}.sp-band{background:var(--neutral-100);padding:14px 20px;font:700 12px/16px var(--font-body);text-transform:uppercase;letter-spacing:.05em;color:var(--text-2);border-radius:var(--radius-md)}.sp-info{display:flex;flex-direction:column;gap:10px;padding:16px 20px;font:400 14px/20px var(--font-body)}.sp-info span{display:flex;align-items:center;gap:10px}.sp-info .sp-icon{color:var(--primary-600)}.sp-ed{margin-left:8px}</style></head><body><div id="r"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="nav.js"></script><script src="_ds_bundle.js"></script>
<script type="text/babel">const egp=n=>"EGP "+(+n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});const {AppShell,TableToolbar,DataTable,Pagination,Badge,Button,Input,Checkbox,ConfirmDeleteModal}=window.Industry_indust;
const D=[["TR_11119","warehouse","General Warehouse",1,200,"Completed","8:08 PM","2083-01-03"],["TR_11118","warehouse","General Warehouse",1,360,"Completed","8:06 PM","2083-01-03"],["TR_11117","warehouse","General Warehouse",1,300,"Completed","12:12 AM","2082-12-24"],["TR_11115","warehouse","General Warehouse",2,427.1,"Completed","11:59 AM","2082-11-23"],["TR_11114","warehouse","General Warehouse",1,146.2,"Sent","8:11 PM","2082-11-01"],["TR_11113","General Warehouse","warehouse",1,100,"Completed","11:05 AM","2082-10-15"],["TR_11112","General Warehouse","warehouse",1,10,"Completed","2:43 PM","2082-10-12"],["TR_11111","warehouse","General Warehouse",1,528,"Completed","12:46 PM","2082-10-10"],["TR_11110","General Warehouse","warehouse",2,51.3,"Completed","7:25 PM","2082-10-09"],["TR_11109","General Warehouse","warehouse",1,10,"Completed","12:30 PM","2082-10-05"]].map((r,i)=>({id:i,ref:r[0],from:r[1],to:r[2],items:r[3],total:egp(r[4]),st:r[5],at:r[6]+" · "+r[7]}));
const cols=(sel,setSel,setDel)=>[{key:"sel",header:<Checkbox aria-label="Select all" checked={sel.length===D.length} onChange={e=>setSel(e.target.checked?D.map(r=>r.id):[])}/>,width:"1%",render:(v,r)=><Checkbox aria-label="Select row" checked={sel.includes(r.id)} onChange={e=>setSel(e.target.checked?[...sel,r.id]:sel.filter(x=>x!==r.id))}/>},{key:"ref",header:"Reference",render:v=><span className="sp-code">{v}</span>},{key:"from",header:"From Warehouse"},{key:"to",header:"To Warehouse"},{key:"items",header:"Items"},{key:"total",header:"Grand Total",align:"right"},{key:"st",header:"Status",render:v=><Badge status={v}/>},{key:"at",header:"Created On",render:v=><Badge tone="info" dot={false}>{v}</Badge>},{key:"act",header:"Action",render:(x,r)=><span style={{display:"flex",gap:2}}><Button variant="ghost" size="sm" iconOnly icon="eye" aria-label="View" onClick={()=>location.href="Create Transfer.html"}/><Button variant="ghost" size="sm" iconOnly icon="pencil" aria-label="Edit" onClick={()=>location.href="Create Transfer.html"}/><Button variant="ghost" size="sm" iconOnly icon="trash-2" aria-label="Delete" style={{color:"var(--danger-500)"}} onClick={()=>setDel(r)}/></span>}];
function App(){const [q,setQ]=React.useState("");const [sel,setSel]=React.useState([]);const [del,setDel]=React.useState(null);const [gone,setGone]=React.useState([]);const rows=D.filter(r=>!gone.includes(r.id)&&r.ref.toLowerCase().includes(q.toLowerCase()));const sum=rows.reduce((a,r)=>a+parseFloat(r.total.replace(/[^0-9.]/g,"")),0).toFixed(2);
return <AppShell items={SP_NAV} activeId="tr" title="Transfers" userName="admin" userRole="Administrator" footer="All Rights Reserved © 2026 Sontic Plus">
<TableToolbar value={q} onSearch={setQ}><Button variant="secondary" iconOnly icon="filter" aria-label="Filter"/><Button icon="plus" onClick={()=>location.href="Create Transfer.html"}>Create Transfer</Button></TableToolbar>
<DataTable columns={cols(sel,setSel,setDel)} rows={rows}><Pagination page={1} pageSize={10} total={40}/></DataTable><ConfirmDeleteModal open={!!del} itemType="transfer" itemName={del?del.ref:undefined} onCancel={()=>setDel(null)} onConfirm={()=>{setGone([...gone,del.id]);setDel(null)}}/></AppShell>}
ReactDOM.createRoot(document.getElementById("r")).render(<App/>);</script></body></html>
