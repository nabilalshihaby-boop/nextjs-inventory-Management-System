<!DOCTYPE html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Purchases Returns · Sontic Plus</title><link rel="stylesheet" href="styles.css"><script src="theme.js"></script><style>.sp-qty{display:inline-flex;align-items:stretch}.sp-qty .sp-btn{width:42px;padding:0;border-radius:var(--radius-md) 0 0 var(--radius-md)}.sp-qty .sp-btn:last-child{border-radius:0 var(--radius-md) var(--radius-md) 0}.sp-qty .sp-input{width:56px;text-align:center;padding:0;border-radius:0;border-left:0;border-right:0}.sp-sug{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-lg);padding:6px}.sp-sum{width:490px;margin-left:auto;border:1px solid var(--border);border-radius:var(--radius-md)}.sp-sum div{display:flex;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border);font:400 14px/20px var(--font-body)}.sp-sum div:last-child{border-bottom:0;color:var(--primary-700);font-weight:700}.sp-band{background:var(--neutral-100);padding:14px 20px;font:700 12px/16px var(--font-body);text-transform:uppercase;letter-spacing:.05em;color:var(--text-2);border-radius:var(--radius-md)}.sp-info{display:flex;flex-direction:column;gap:10px;padding:16px 20px;font:400 14px/20px var(--font-body)}.sp-info span{display:flex;align-items:center;gap:10px}.sp-info .sp-icon{color:var(--primary-600)}.sp-ed{margin-left:8px}</style></head><body><div id="r"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="nav.js"></script><script src="_ds_bundle.js"></script>
<script type="text/babel">const egp=n=>"EGP "+(+n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});const {AppShell,TableToolbar,DataTable,Pagination,Badge,Button,Input,ConfirmDeleteModal}=window.Industry_indust;
const D=[["PR_1115","1110.00","2:06 AM","2026-06-03"],["PR_1114","1110.00","1:58 AM","2026-06-03"],["PR_1113","493.00","1:40 AM","2026-06-03"],["PR_1111","890.00","11:20 PM","2026-05-27"]].map((r,i)=>({id:i,ref:r[0],total:egp(r[1]),paid:"EGP 0.00",due:"EGP 0.00",at:r[2]+" · "+r[3]}));
const cols=[{key:"ref",header:"Reference",render:v=><span className="sp-code">{v}</span>},{key:"sup",header:"Supplier",render:()=>"China",primary:true},{key:"wh",header:"Warehouse",render:()=>"Office"},{key:"st",header:"Status",render:()=><Badge status="Received"/>},{key:"total",header:"Grand Total",align:"right"},{key:"paid",header:"Paid",align:"right"},{key:"due",header:"Due",align:"right"},{key:"pt",header:"Payment Type",render:()=><Badge tone="primary" dot={false}>Cash</Badge>},{key:"at",header:"Created On",render:v=><Badge tone="info" dot={false}>{v}</Badge>}];
function App(){const [q,setQ]=React.useState("");const [del,setDel]=React.useState(null);const [gone,setGone]=React.useState([]);const rows=D.filter(r=>!gone.includes(r.id)&&r.ref.toLowerCase().includes(q.toLowerCase()));const sum=rows.reduce((a,r)=>a+parseFloat(r.total.replace(/[^0-9.]/g,"")),0).toFixed(2);
return <AppShell items={SP_NAV} activeId="pu2" title="Purchases Returns" userName="admin" userRole="Administrator" footer="All Rights Reserved © 2026 Sontic Plus">
<TableToolbar value={q} onSearch={setQ}><Button variant="secondary" iconOnly icon="filter" aria-label="Filter"/><div style={{width:240}}><Input type="date" aria-label="Select Date"/></div><Button icon="plus" onClick={()=>location.href="Create Purchase Return.html"}>Create Purchase Return</Button></TableToolbar>
<DataTable columns={cols} rows={rows} actions={r=>[{label:"View Purchases Return",icon:"eye",onClick:()=>location.href="Purchase Details.html"},{label:"Download PDF",icon:"file-down"},{label:"Edit Purchases Return",icon:"pencil",onClick:()=>location.href="Create Purchase Return.html"},"-",{label:"Delete Purchases Return",icon:"trash-2",danger:true,onClick:()=>setDel(r)}]}><Pagination page={1} pageSize={10} total={rows.length}/></DataTable><ConfirmDeleteModal open={!!del} itemType="purchase return" itemName={del?del.ref:undefined} onCancel={()=>setDel(null)} onConfirm={()=>{setGone([...gone,del.id]);setDel(null)}}/></AppShell>}
ReactDOM.createRoot(document.getElementById("r")).render(<App/>);</script></body></html>
