<!DOCTYPE html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Create Purchase · Sontic Plus</title><link rel="stylesheet" href="styles.css"><script src="theme.js"></script><style>.sp-qty{display:inline-flex;align-items:stretch}.sp-qty .sp-btn{width:42px;padding:0;border-radius:var(--radius-md) 0 0 var(--radius-md)}.sp-qty .sp-btn:last-child{border-radius:0 var(--radius-md) var(--radius-md) 0}.sp-qty .sp-input{width:56px;text-align:center;padding:0;border-radius:0;border-left:0;border-right:0}.sp-sug{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-lg);padding:6px}.sp-sum{width:490px;margin-left:auto;border:1px solid var(--border);border-radius:var(--radius-md)}.sp-sum div{display:flex;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border);font:400 14px/20px var(--font-body)}.sp-sum div:last-child{border-bottom:0;color:var(--primary-700);font-weight:700}.sp-band{background:var(--neutral-100);padding:14px 20px;font:700 12px/16px var(--font-body);text-transform:uppercase;letter-spacing:.05em;color:var(--text-2);border-radius:var(--radius-md)}.sp-info{display:flex;flex-direction:column;gap:10px;padding:16px 20px;font:400 14px/20px var(--font-body)}.sp-info span{display:flex;align-items:center;gap:10px}.sp-info .sp-icon{color:var(--primary-600)}.sp-ed{margin-left:8px}</style></head><body><div id="r"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="nav.js"></script><script src="tabs.js"></script><script src="_ds_bundle.js"></script><script src="demo.js"></script><script type="text/babel" src="demo.jsx"></script>
<script type="text/babel">const egp=n=>"EGP "+(+n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});const {AppShell,PageHeader,FormCard,Field,Input,Select,Textarea,Button,Badge,Modal,ConfirmDeleteModal}=window.Industry_indust;
const PRODUCTS=[["005cp","collagen powder",493,110],["001","FACE FAT AND DOUBLE CHIN",1110,2],["003uc","ultrasonic scrubber",890,7],["001hs","intensive hair serum set",650,94],["002","ipl laser hair removal",1620,0],["006lpc","lip care set",450,100]].map(p=>({code:p[0],name:p[1],cost:p[2],stock:p[3],qty:1,taxType:"Exclusive",tax:0,discType:"Fixed",disc:0}));
const calc=i=>{const base=i.cost*i.qty;const d=i.discType==="Fixed"?+i.disc||0:base*(+i.disc||0)/100;const t=(base-d)*(+i.tax||0)/100;return{d,t,sub:base-d+(i.taxType==="Exclusive"?t:0)}};
const f=n=>egp(n);
function App(){const db=useDemo();const [del,setDel]=React.useState(null);
const [q,setQ]=React.useState("");const [focus,setFocus]=React.useState(false);const [items,setItems]=React.useState([PRODUCTS[0],PRODUCTS[1]]);
const [tax,setTax]=React.useState("0");const [disc,setDisc]=React.useState("0");const [ship,setShip]=React.useState("0");const [edit,setEdit]=React.useState(null);const [err,setErr]=React.useState("");
const sug=q?PRODUCTS.filter(p=>(p.code+p.name).toLowerCase().includes(q.toLowerCase())):[];
const add=p=>{setItems(items.find(i=>i.code===p.code)?items:[...items,p]);setQ("")};
const upd=(c,patch)=>setItems(items.map(i=>i.code===c?{...i,...patch}:i));
const sub=items.reduce((a,i)=>a+calc(i).sub,0);const taxAmt=sub*(+tax||0)/100;const grand=sub+taxAmt-(+disc||0)+(+ship||0);
const E=({p,v})=>edit&&<Field label={p.l} required={p.r}>{v}</Field>;
return <AppShell items={SP_NAV} activeId="pu1" title="Purchases" userName="admin" userRole="Administrator" footer="All Rights Reserved © 2026 Sontic Plus">
<PageHeader title="Create Purchase"><Button variant="secondary" icon="arrow-left" onClick={()=>location.href="Purchases.html"}>Back</Button></PageHeader>
<FormCard columns={1} onCancel={()=>setItems([])} onSave={()=>{if(!items.length)setErr("Add at least one order item")}}><div style={{display:"flex",flexDirection:"column",gap:24}}>
<div className="sp-form-grid" style={{"--cols":3}}><Field label="Date" required><Input type="date" defaultValue="2026-05-27"/></Field><Field label="Warehouse" required><Select disabled defaultValue="Office" options={["Office"]}/></Field><Field label="Supplier" required><Select defaultValue={db.suppliers[0].id} options={db.suppliers.map(s=>({value:s.id,label:s.name}))}/></Field></div>
<Field label="Product"><div style={{position:"relative"}}><Input icon="search" placeholder="Search Product by Code Name" value={q} onChange={e=>setQ(e.target.value)} onFocus={()=>setFocus(true)} onBlur={()=>setTimeout(()=>setFocus(false),150)}/>{focus&&sug.length>0&&<div className="sp-sug">{sug.map(p=><button key={p.code} type="button" className="sp-menu-item" onMouseDown={()=>add(p)}><span className="sp-code">{p.code}</span>{p.name}</button>)}</div>}</div></Field>
<Field label="Order items" required error={err}><div className="sp-table-card" style={{boxShadow:"none"}}><div className="sp-table-scroll"><table className="sp-table"><thead><tr><th>Product</th><th>Net Unit Cost</th><th>Stock</th><th>Qty</th><th>Discount</th><th>Tax</th><th>Subtotal</th><th className="act">Action</th></tr></thead><tbody>
{items.length===0&&<tr><td colSpan="8" style={{color:"var(--text-3)"}}>No order items</td></tr>}
{items.map(i=>{const c=calc(i);return <tr key={i.code} style={{height:80}}><td style={{padding:"12px 20px"}}><div style={{fontWeight:600,marginBottom:4}}>{i.code}</div><span style={{display:"flex",alignItems:"center",gap:6}}><Badge tone="success" dot={false}>{i.name}</Badge><Button variant="ghost" size="sm" iconOnly icon="pencil" aria-label="Edit item" onClick={()=>setEdit({...i})}/></span></td><td>{f(i.cost)}</td><td><Badge tone="warning" dot={false}>{i.stock} pic</Badge></td>
<td><span className="sp-qty"><Button iconOnly icon="minus" aria-label="Decrease" onClick={()=>upd(i.code,{qty:Math.max(1,i.qty-1)})}/><input className="sp-input" value={i.qty} onChange={e=>upd(i.code,{qty:Math.max(1,parseInt(e.target.value)||1)})}/><Button iconOnly icon="plus" aria-label="Increase" onClick={()=>upd(i.code,{qty:i.qty+1})}/></span></td>
<td>{f(c.d)}</td><td>{f(c.t)}</td><td>{f(c.sub)}</td><td className="act"><Button variant="ghost" size="sm" iconOnly icon="trash-2" aria-label="Remove" style={{color:"var(--danger-500)"}} onClick={()=>setDel(i)}/></td></tr>})}
</tbody></table></div></div></Field>
<div className="sp-sum"><div><span>Order Tax</span><span>{f(taxAmt)} ({(+tax||0).toFixed(2)}) %</span></div><div><span>Discount</span><span>{f(+disc||0)}</span></div><div><span>Shipping</span><span>{f(+ship||0)}</span></div><div><span>Grand Total</span><span>{f(grand)}</span></div></div>
<div className="sp-form-grid" style={{"--cols":3}}><Field label="Order Tax"><Input addon="%" value={tax} onChange={e=>setTax(e.target.value)}/></Field><Field label="Discount"><Input addon="EGP" value={disc} onChange={e=>setDisc(e.target.value)}/></Field><Field label="Shipping"><Input addon="EGP" value={ship} onChange={e=>setShip(e.target.value)}/></Field></div>
<div style={{width:"33%",minWidth:260}}><Field label="Status" required><Select defaultValue="Received" options={["Received","Pending","Ordered"]}/></Field></div>
<Field label="Notes"><Textarea placeholder="Enter Notes"/></Field></div></FormCard>
<Modal open={!!edit} size="sm" title={edit?edit.name:""} onClose={()=>setEdit(null)} footer={<><Button variant="secondary" onClick={()=>setEdit(null)}>Cancel</Button><Button onClick={()=>{upd(edit.code,edit);setEdit(null)}}>Save</Button></>}>
{edit&&<div style={{display:"flex",flexDirection:"column",gap:20}}>
<Field label="Product Cost" required><Input addon="EGP" value={edit.cost} onChange={e=>setEdit({...edit,cost:+e.target.value||0})}/></Field>
<Field label="Tax Type" required><Select value={edit.taxType} onChange={e=>setEdit({...edit,taxType:e.target.value})} options={["Inclusive","Exclusive"]}/></Field>
<Field label="Order Tax"><Input addon="%" value={edit.tax} onChange={e=>setEdit({...edit,tax:e.target.value})}/></Field>
<Field label="Discount Type" required><Select value={edit.discType} onChange={e=>setEdit({...edit,discType:e.target.value})} options={["Fixed","Percentage"]}/></Field>
<Field label="Discount" required><Input value={edit.disc} onChange={e=>setEdit({...edit,disc:e.target.value})}/></Field>
<Field label="Purchase Unit" required><Select defaultValue="Pic" options={["Pic","Box"]}/></Field></div>}</Modal><ConfirmDeleteModal open={!!del} itemType="product" itemName={del?del.name:undefined} onCancel={()=>setDel(null)} onConfirm={()=>{setItems(items.filter(x=>x.code!==del.code));setDel(null)}}/></AppShell>}
ReactDOM.createRoot(document.getElementById("r")).render(<App/>);</script></body></html>
