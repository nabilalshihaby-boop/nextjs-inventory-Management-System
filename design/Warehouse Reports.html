<!DOCTYPE html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Warehouse Reports · Sontic Plus</title><link rel="stylesheet" href="styles.css"><script src="theme.js"></script></head><body><div id="r"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="nav.js"></script><script src="tabs.js"></script><script src="_ds_bundle.js"></script>
<script type="text/babel">const egp=n=>"EGP "+(+n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});const {AppShell,StatCard,Tabs,TableToolbar,DataTable,Pagination,Badge,Button,Field,Select,Input}=window.Industry_indust;
const shell=(tab,children)=><AppShell items={SP_NAV} activeId="re" title="Reports" tabs={SP_REPORT_TABS} moreTabs={SP_REPORT_MORE} activeTab={tab} userName="admin" userRole="Administrator" footer="All Rights Reserved © 2026 Sontic Plus">{children}</AppShell>;
const WH=({v,set,opts})=><div style={{width:420,margin:"0 auto 24px"}}><Field label="Warehouse"><Select value={v} onChange={e=>set(e.target.value)} options={opts}/></Field></div>;
const sale=[["SA_11149","71800.00"],["SA_11148","31920.00"],["SA_11147","7980.00"],["SA_11146","11970.00"],["SA_11145","7980.00"],["SA_11144","7480.00"],["SA_11143","11970.00"],["SA_11142","11470.00"],["SA_11141","11970.00"],["SA_11140","11970.00"]].map((r,i)=>({id:i,ref:r[0],total:egp(r[1]),paid:egp(r[1]),due:"EGP 0.00"}));
const code=v=><span className="sp-code">{v}</span>;
const sr=[["SR_1116","7980.00","Pending","Unpaid"],["SR_1115","11970.00","Pending","Unpaid"],["SR_1114","7980.00","Pending","Unpaid"],["SR_1113","9470.00","Pending","Unpaid"],["SR_1112","20940.00","Pending","Unpaid"],["SR_1111","17450.00","Pending","Unpaid"]].map((r,i)=>({id:i,ref:r[0],total:egp(r[1]),paid:"EGP 0.00",due:egp(r[1]),st:r[2],pay:r[3]}));
const pr=[["PR_1115","1110.00"],["PR_1114","1110.00"],["PR_1113","493.00"],["PR_1111","890.00"]].map((r,i)=>({id:i,ref:r[0],total:egp(r[1]),paid:"EGP 0.00",due:"EGP 0.00"}));
const ex=[["EX_114","Salary","Arabi Salary","10000.00"],["EX_113","Raju Payment","USA Raju Payment","33000.00"],["EX_112","Software","Other Cost","10000.00"],["EX_111","Raju Ads Payment","USA Raju Payment","80000.00"]].map((r,i)=>({id:i,ref:r[0],title:r[1],cat:r[2],amt:egp(r[3])}));
const C={
sales:{rows:sale,total:49,cols:[{key:"ref",header:"Reference",render:code},{key:"c",header:"Customer",render:()=>"direct-customer",primary:true},{key:"w",header:"Warehouse",render:()=>"Office"},{key:"s",header:"Status",render:()=><Badge status="Received"/>},{key:"total",header:"Grand Total",align:"right"},{key:"paid",header:"Paid",align:"right"},{key:"due",header:"Due",align:"right"},{key:"p",header:"Payment Status",render:()=><Badge status="Paid"/>}]},
sret:{rows:sr,total:6,cols:[{key:"ref",header:"Reference",render:code},{key:"c",header:"Customer",render:()=>"direct-customer",primary:true},{key:"w",header:"Warehouse",render:()=>"Office"},{key:"st",header:"Status",render:v=><Badge status={v}/>},{key:"total",header:"Grand Total",align:"right"},{key:"paid",header:"Paid",align:"right"},{key:"due",header:"Due",align:"right"},{key:"pay",header:"Payment Status",render:v=><Badge status={v}/>}]},
pret:{rows:pr,total:4,cols:[{key:"ref",header:"Reference",render:code},{key:"c",header:"Supplier",render:()=>"China",primary:true},{key:"w",header:"Warehouse",render:()=>"Office"},{key:"s",header:"Status",render:()=><Badge status="Received"/>},{key:"total",header:"Grand Total",align:"right"},{key:"paid",header:"Paid",align:"right"},{key:"due",header:"Due",align:"right"}]},
exp:{rows:ex,total:4,cols:[{key:"ref",header:"Reference",render:code},{key:"title",header:"Expense Title",primary:true},{key:"w",header:"Warehouse",render:()=>"Office"},{key:"cat",header:"Expense Category"},{key:"amt",header:"Amount",align:"right"}]}};
function App(){const [wh,setWh]=React.useState("All Warehouse");const [tab,setTab]=React.useState("sales");const [q,setQ]=React.useState("");const d=C[tab];const rows=d.rows.filter(r=>r.ref.toLowerCase().includes(q.toLowerCase()));
return shell("wh",<><WH v={wh} set={setWh} opts={["All Warehouse","Office"]}/>
<div className="sp-kpi-grid" style={{marginBottom:32}}><StatCard tone="teal" icon="shopping-cart" value="49.00" label="Sales"/><StatCard tone="green" icon="package-plus" value="9.00" label="Purchases"/><StatCard tone="blue" icon="arrow-right" value="6.00" label="Sales Return"/><StatCard tone="amber" icon="arrow-left" value="4.00" label="Purchases Return"/></div>
<Tabs value={tab} onChange={t=>{setTab(t);setQ("")}} tabs={[{id:"sales",label:"Sales"},{id:"sret",label:"Sales Returns"},{id:"pret",label:"Purchases Returns"},{id:"exp",label:"Expenses"}]}/>
<TableToolbar value={q} onSearch={setQ}><Button variant="secondary" iconOnly icon="filter" aria-label="Filter"/><Button icon="file-spreadsheet">EXCEL</Button></TableToolbar>
<DataTable columns={d.cols} rows={rows}><Pagination page={1} pageSize={10} total={tab==="sales"?49:rows.length}/></DataTable></>)}
ReactDOM.createRoot(document.getElementById("r")).render(<App/>);</script></body></html>
