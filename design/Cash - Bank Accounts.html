<!DOCTYPE html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Cash &amp; Bank Accounts · Sontic Plus</title><link rel="stylesheet" href="styles.css"><script src="theme.js"></script></head><body><div id="r"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="nav.js"></script><script src="tabs.js"></script><script src="_ds_bundle.js"></script><script src="demo.js"></script><script src="customer-data.js"></script><script src="fin.js"></script><script type="text/babel" src="demo.jsx"></script><script type="text/babel" src="finui.jsx"></script>
<style>.sp-kpi-grid .sp-stat-value{font-size:20px}.sp-kpi-grid>:nth-child(4) .sp-stat-value{font-size:25px}</style>
<script type="text/babel">const egp=n=>"EGP "+(+n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const {AppShell,PageHeader,StatCard,TableToolbar,DataTable,Pagination,Button,Field,Select,Input,Textarea,Badge,Icon,Modal}=window.Industry_indust;
const SEED=[{id:"a1",name:"Main Cash Register",type:"Cash",ref:"CR-001",bank:"",balance:45000,status:"Active",notes:"Main shop floor register."},{id:"a2",name:"POS Cash Drawer",type:"Cash",ref:"CR-002",bank:"",balance:18250,status:"Active",notes:"Drawer attached to POS terminal 1."},{id:"a3",name:"Branch Cash Register",type:"Cash",ref:"CR-003",bank:"",balance:22500,status:"Active",notes:"Maadi branch register."},{id:"a4",name:"CIB Business Account",type:"Bank",ref:"1020 3344 5566",bank:"Commercial International Bank (CIB)",balance:210000,status:"Active",notes:"Main operating account."},{id:"a5",name:"Banque Misr Account",type:"Bank",ref:"0450 7788 1200",bank:"Banque Misr",balance:114500,status:"Active",notes:"Supplier payments account."}];
const TX={Cash:[["27/05/2026","POS cash sales","SA_2047","in",12400],["27/05/2026","Customer collection · Ahmed Hassan","RC_3006","in",20000],["26/05/2026","Operating expense · Electricity","EX_112","out",2000],["25/05/2026","Cash deposit to CIB Business Account","DP_0091","out",15000],["24/05/2026","POS cash sales","SA_2040","in",8650],["23/05/2026","Supplier payment · China","PY_2003","out",30000]],
Bank:[["27/05/2026","Customer collection · Karim Mostafa","RC_3023","in",25000],["26/05/2026","Cash deposit from Main Cash Register","DP_0091","in",15000],["25/05/2026","Supplier payment · China","PY_2002","out",50000],["24/05/2026","Bank transfer to Banque Misr Account","BT_0034","out",40000],["22/05/2026","Customer collection · Youssef Ibrahim","RC_3042","in",20000],["20/05/2026","Operating expense · Office rent","EX_109","out",18000]]};
const BLANK={name:"",type:"Cash",ref:"",bank:"",balance:"",status:"Active",notes:""};
function App(){useFin();const [toast,setToast]=useToast();const [rows0,setRows]=React.useState(SEED);const rows=rows0.map(r=>({...r,balance:r.balance+FIN.delta(r.id)}));const [q,setQ]=React.useState(""),[ty,setTy]=React.useState("All"),[st,setSt]=React.useState("All"),[page,setPage]=React.useState(1),[size,setSize]=React.useState(10);
const [modal,setModal]=React.useState(null),[f,setF]=React.useState(BLANK),[e,setE]=React.useState({}),[view,setView]=React.useState(null);
const act=rows.filter(r=>r.status==="Active");const cash=act.filter(r=>r.type==="Cash").reduce((a,r)=>a+r.balance,0),bank=act.filter(r=>r.type==="Bank").reduce((a,r)=>a+r.balance,0);
const list=rows.filter(r=>(!q||(r.name+r.ref+r.bank).toLowerCase().includes(q.toLowerCase()))&&(ty==="All"||r.type===ty)&&(st==="All"||r.status===st));
const shown=list.slice((page-1)*size,page*size);const filt=q||ty!=="All"||st!=="All";
const openAdd=()=>{setF(BLANK);setE({});setModal("add")};const openEdit=r=>{setF({...r,balance:String(r.balance)});setE({});setModal(r.id)};const dl=id=>FIN.delta(id);
const save=()=>{const n={};if(!f.name.trim())n.name="Account name is required";if(f.type==="Bank"&&!f.bank.trim())n.bank="Bank name is required";if(f.type==="Bank"&&!f.ref.trim())n.ref="Account number is required for bank accounts";if(f.balance===""||isNaN(+f.balance)||+f.balance<0)n.balance="Enter a valid amount (0 or more)";setE(n);if(Object.keys(n).length)return;
const rec={...f,name:f.name.trim(),balance:+f.balance,bank:f.type==="Bank"?f.bank.trim():"",ref:f.ref.trim()||(f.type==="Cash"?"CR-"+String(rows.length+1).padStart(3,"0"):"")};
if(modal==="add"){setRows([...rows0,{...rec,id:"a"+Date.now()}]);setToast("Account added (demo only)")}else{setRows(rows0.map(r=>r.id===modal?{...r,...rec,balance:rec.balance-dl(r.id)}:r));if(view&&view.id===modal)setView({...view,...rec});setToast("Account updated (demo only)")}setModal(null)};
const toggle=r=>{const s=r.status==="Active"?"Inactive":"Active";setRows(rows0.map(x=>x.id===r.id?{...x,status:s}:x));if(view&&view.id===r.id)setView({...view,status:s});setToast("Account "+(s==="Active"?"activated":"deactivated"))};
const goTx=r=>location.href="Cash - Bank Transactions.html?account="+r.id;
const cols=[{key:"name",header:"Account Name",primary:true,render:(v,r)=><button type="button" onClick={()=>setView(r)} style={{display:"flex",alignItems:"center",gap:12,background:"none",border:0,padding:"4px 0",cursor:"pointer",font:"600 14px/20px var(--font-body)",color:"var(--primary-700)",textAlign:"left"}}><span style={{width:36,height:36,borderRadius:"var(--radius-md)",display:"grid",placeItems:"center",background:r.type==="Cash"?"var(--success-50,var(--primary-100))":"var(--primary-100)",color:r.type==="Cash"?"var(--success-700,var(--primary-700))":"var(--primary-700)"}}><Icon name={r.type==="Cash"?"banknote":"landmark"} size={18}/></span>{v}</button>,text:r=>r.name},
{key:"type",header:"Account Type",render:v=><Badge tone={v==="Cash"?"success":"info"} dot={false}>{v}</Badge>},{key:"ref",header:"Account / Reference Number",render:v=>v?<span className="sp-code">{v}</span>:"—"},{key:"balance",header:"Current Balance",align:"right",render:v=><b>{egp(v)}</b>},{key:"status",header:"Status",render:v=><Badge tone={v==="Active"?"success":"neutral"}>{v}</Badge>}];
const T=view?TX[view.type]:[];
return <AppShell items={SP_NAV} activeId="f1" title="Cash &amp; Bank Accounts" userName="admin" userRole="Administrator" footer="All Rights Reserved © 2026 Sontic Plus">
<PageHeader title="Cash &amp; Bank Accounts"><Button icon="plus" onClick={openAdd}>Add New Account</Button></PageHeader>
<p className="t-body" style={{margin:"-8px 0 24px",color:"var(--text-2)"}}>Manage cash registers, cash accounts, and bank balances.</p>
<div className="sp-kpi-grid" style={{marginBottom:32}}><StatCard tone="green" icon="banknote" value={egp(cash)} label="Total Cash Balance"/><StatCard tone="blue" icon="landmark" value={egp(bank)} label="Total Bank Balance"/><StatCard tone="teal" icon="wallet" value={egp(cash+bank)} label="Total Available Funds" note="Active accounts only"/><StatCard tone="violet" icon="circle-check" value={String(act.length)} label="Active Accounts"/></div>
<TableToolbar value={q} onSearch={v=>{setQ(v);setPage(1)}} searchPlaceholder="Search accounts">
<div style={{width:170}}><Select aria-label="Account type" value={ty} onChange={x=>{setTy(x.target.value);setPage(1)}} options={[{value:"All",label:"All Types"},"Cash","Bank"]}/></div>
<div style={{width:170}}><Select aria-label="Status" value={st} onChange={x=>{setSt(x.target.value);setPage(1)}} options={[{value:"All",label:"All Statuses"},"Active","Inactive"]}/></div></TableToolbar>
{list.length===0?<div className="sp-card sp-empty"><Icon name="landmark" size={36}/><div className="t-section-title">{filt?"No accounts match your filters":"No accounts yet"}</div>{filt?<Button variant="secondary" onClick={()=>{setQ("");setTy("All");setSt("All")}}>Clear filters</Button>:<Button icon="plus" onClick={openAdd}>Add New Account</Button>}</div>
:<DataTable columns={cols} rows={shown} actions={r=>[{label:"View Details",icon:"eye",onClick:()=>setView(r)},{label:"Edit Account",icon:"pencil",onClick:()=>openEdit(r)},{label:"View Transactions",icon:"list",onClick:()=>goTx(r)},"-",{label:r.status==="Active"?"Deactivate Account":"Activate Account",icon:r.status==="Active"?"ban":"circle-check",danger:r.status==="Active",onClick:()=>toggle(r)}]}><Pagination page={page} pageSize={size} total={list.length} onPage={setPage} onPageSize={m=>{setSize(m);setPage(1)}}/></DataTable>}
<Modal open={!!modal} size="md" title={modal==="add"?"Add New Account":"Edit Account"} onClose={()=>setModal(null)} footer={<><Button variant="secondary" onClick={()=>setModal(null)}>Cancel</Button><Button onClick={save}>Save Account</Button></>}>
<div className="sp-form-grid"><Field label="Account Name" required error={e.name}><Input placeholder="Enter Account Name" value={f.name} onChange={x=>{setF({...f,name:x.target.value});setE({...e,name:""})}}/></Field>
<Field label="Account Type" required><Select value={f.type} onChange={x=>{setF({...f,type:x.target.value});setE({})}} options={["Cash","Bank"]}/></Field>
{f.type==="Bank"&&<Field label="Bank Name" required error={e.bank}><Input placeholder="e.g. National Bank of Egypt" value={f.bank} onChange={x=>{setF({...f,bank:x.target.value});setE({...e,bank:""})}}/></Field>}
<Field label={f.type==="Bank"?"Account Number":"Reference (optional)"} required={f.type==="Bank"} error={e.ref}><Input placeholder={f.type==="Bank"?"Enter Account Number":"e.g. CR-004"} value={f.ref} onChange={x=>{setF({...f,ref:x.target.value});setE({...e,ref:""})}}/></Field>
<Field label={modal==="add"?"Opening Balance":"Current Balance"} required error={e.balance}><Input type="number" min="0" addon="EGP" placeholder="0.00" value={f.balance} onChange={x=>{setF({...f,balance:x.target.value});setE({...e,balance:""})}}/></Field>
<Field label="Currency"><Select disabled value="EGP" options={[{value:"EGP",label:"EGP – Egyptian Pound"}]}/></Field>
<Field label="Status"><Select value={f.status} onChange={x=>setF({...f,status:x.target.value})} options={["Active","Inactive"]}/></Field><div/>
<Field label="Description / Notes" className="sp-span-all"><Textarea placeholder="Enter Notes" value={f.notes} onChange={x=>setF({...f,notes:x.target.value})}/></Field></div></Modal>
<Modal open={!!view} size="lg" title={view?view.name:""} onClose={()=>setView(null)} footer={<><Button variant="secondary" onClick={()=>setView(null)}>Close</Button>{view&&<Button variant="secondary" icon="pencil" onClick={()=>{const r=view;setView(null);openEdit(r)}}>Edit Account</Button>}{view&&<Button icon="list" onClick={()=>goTx(view)}>View Transactions</Button>}</>}>
{view&&<div style={{display:"flex",flexDirection:"column",gap:24}}>
<div style={{display:"grid",gridTemplateColumns:"repeat(4,minmax(0,1fr))",gap:16}}>{[["Account Type",<Badge tone={view.type==="Cash"?"success":"info"} dot={false}>{view.type}</Badge>],["Reference",view.ref?<span className="sp-code">{view.ref}</span>:"—"],["Current Balance",<b style={{fontSize:18}}>{egp(view.balance)}</b>],["Status",<Badge tone={view.status==="Active"?"success":"neutral"}>{view.status}</Badge>]].map(([l,v])=><div key={l}><div className="t-caption" style={{marginBottom:6}}>{l}</div><div>{v}</div></div>)}</div>
{(view.bank||view.notes)&&<div className="t-body" style={{color:"var(--text-2)"}}>{view.bank&&<div><b>Bank:</b> {view.bank}</div>}{view.notes&&<div>{view.notes}</div>}</div>}
<div><div style={{display:"flex",alignItems:"center",gap:12,marginBottom:12}}><h3 className="t-section-title" style={{margin:0}}>Recent Transactions</h3><Badge tone="warning" dot={false}>Sample data</Badge></div>
<div className="sp-table-card" style={{boxShadow:"none"}}><table className="sp-table"><thead><tr><th>Date</th><th>Description</th><th>Reference</th><th>Type</th><th className="num">Amount</th></tr></thead><tbody>{T.map((t,i)=><tr key={i}><td>{t[0]}</td><td className="primary-cell">{t[1]}</td><td><span className="sp-code">{t[2]}</span></td><td><Badge tone={t[3]==="in"?"success":"danger"} dot={false}>{t[3]==="in"?"Money In":"Money Out"}</Badge></td><td className="num" style={{color:t[3]==="in"?"var(--success-700,inherit)":"var(--danger-500)"}}>{t[3]==="in"?"+ ":"− "}{egp(t[4])}</td></tr>)}</tbody></table></div></div></div>}</Modal>{toast}</AppShell>}
ReactDOM.createRoot(document.getElementById("r")).render(<App/>);</script></body></html>
