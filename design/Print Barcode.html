<!DOCTYPE html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Print Barcode · Sontic Plus</title><link rel="stylesheet" href="styles.css"><script src="theme.js"></script><style>.sp-pb{display:flex;flex-direction:column;gap:24px}.sp-pb-sw{display:grid;grid-template-columns:minmax(240px,1fr) repeat(3,auto);gap:32px;align-items:end}.sp-pb-sw .sp-switch{white-space:nowrap;height:var(--control-h)}.sp-pb-sw .sp-label{white-space:nowrap}.sp-pb-sw .sp-field{max-width:none}.sp-sug{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-lg);padding:6px}.sp-preview{border:1px solid var(--border-strong);border-radius:var(--radius-md);padding:12px;background:#fff;align-self:center;width:min(100%,990px)}.sp-labels{display:grid;gap:0}.sp-lbl{border:1px dotted var(--neutral-400);padding:8px 6px;text-align:center;font:400 13px/16px var(--font-body);color:#000;min-height:108px}.sp-lbl b{font-weight:700}.sp-bars{display:flex;justify-content:center;align-items:stretch;height:32px;margin:4px 0 2px;gap:0}.sp-bars i{display:block;background:#000}@media print{body *{visibility:hidden}.sp-preview,.sp-preview *{visibility:visible}.sp-preview{position:absolute;left:0;top:0;border:0}}</style></head><body><div id="r"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="nav.js"></script><script src="_ds_bundle.js"></script>
<script type="text/babel">const egp=n=>"EGP "+(+n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});const {AppShell,Field,Input,Select,Switch,Button,Badge,ConfirmDeleteModal}=window.Industry_indust;
const PRODUCTS=[["001","FACE FAT AND DOUBLE CHIN",3490],["002","ipl laser hair removal",3990],["003uc","ultrasonic scrubber",2990],["001hs","intensive hair serum set",2490],["005cp","collagen powder",1690],["006lpc","lip care set",1790]].map(p=>({code:p[0],name:p[1],price:p[2]}));
const PAPER=[["30 per sheet (2.625 * 1)",3],["20 per sheet (4 * 1)",2],["14 per sheet (4 * 1.33)",2],["10 per sheet (4 * 2)",2]];
const W=[1,2,1,3,1,2,1,1,3,1,2,1,2,1,1,3,1,2,1,1,3,2,1,2,1,1,3,1];
const Bars=({code})=>{const s=[...code.toUpperCase()].reduce((a,c,i)=>a.concat([(c.charCodeAt(0)+i)%3+1,(c.charCodeAt(0)*3+i)%2+1]),[]);const seq=[2,1,...s,...W.slice(0,14),1,2];return <div className="sp-bars">{seq.map((w,i)=><i key={i} style={{width:w*1.6,marginRight:i%2?1.4:0,background:i%2?"transparent":"#000"}}/>)}</div>};
function App(){const [del,setDel]=React.useState(null);
const [wh,setWh]=React.useState("Office");const [q,setQ]=React.useState("");const [focus,setFocus]=React.useState(false);
const [items,setItems]=React.useState([{...PRODUCTS[2],qty:10}]);const [paper,setPaper]=React.useState(PAPER[0][0]);
const [co,setCo]=React.useState(true);const [pn,setPn]=React.useState(true);const [pr,setPr]=React.useState(true);const [prev,setPrev]=React.useState(true);
const sug=q?PRODUCTS.filter(p=>(p.code+p.name).toLowerCase().includes(q.toLowerCase())):[];
const add=p=>{setItems(items.find(i=>i.code===p.code)?items:[...items,{...p,qty:1}]);setQ("")};
const cols=(PAPER.find(p=>p[0]===paper)||PAPER[0])[1];
const labels=items.flatMap(i=>Array.from({length:Math.max(0,+i.qty||0)},()=>i));
return <AppShell items={SP_NAV} activeId="p6" title="Print Barcode" userName="admin" userRole="Administrator" footer="All Rights Reserved © 2026 Sontic Plus">
<div className="sp-card sp-form-card"><div className="sp-pb">
<div style={{width:"33%",minWidth:280}}><Field label="Warehouse" required><Select value={wh} onChange={e=>setWh(e.target.value)} options={["Office"]}/></Field></div>
<Field label="Product"><div style={{position:"relative"}}><Input icon="search" placeholder="Search Product by Code Name" value={q} onChange={e=>setQ(e.target.value)} onFocus={()=>setFocus(true)} onBlur={()=>setTimeout(()=>setFocus(false),150)}/>{focus&&sug.length>0&&<div className="sp-sug">{sug.map(p=><button key={p.code} type="button" className="sp-menu-item" onMouseDown={()=>add(p)}><span className="sp-code">{p.code}</span>{p.name}</button>)}</div>}</div></Field>
<div className="sp-table-card" style={{boxShadow:"none"}}><table className="sp-table"><thead><tr><th>Product</th><th>Qty</th><th className="act">Action</th></tr></thead><tbody>
{items.length===0&&<tr><td colSpan="3" style={{color:"var(--text-3)"}}>No products added</td></tr>}
{items.map(i=><tr key={i.code} style={{height:80}}><td style={{padding:"12px 20px"}}><div style={{fontWeight:600,marginBottom:4}}>{i.code}</div><Badge tone="success" dot={false}>{i.name}</Badge></td><td style={{width:"36%"}}><Input type="number" min="1" value={i.qty} onChange={e=>setItems(items.map(x=>x.code===i.code?{...x,qty:e.target.value}:x))}/></td><td className="act"><Button variant="ghost" size="sm" iconOnly icon="trash-2" aria-label="Remove" style={{color:"var(--danger-500)"}} onClick={()=>setDel(i)}/></td></tr>)}
</tbody></table></div>
<div className="sp-pb-sw"><Field label="Paper size" required><Select value={paper} onChange={e=>setPaper(e.target.value)} options={PAPER.map(p=>p[0])}/></Field><Switch label="Show Company Name" checked={co} onChange={e=>setCo(e.target.checked)}/><Switch label="Show Product Name" checked={pn} onChange={e=>setPn(e.target.checked)}/><Switch label="Show Price" checked={pr} onChange={e=>setPr(e.target.checked)}/></div>
<div style={{display:"flex",gap:16}}><Button variant="secondary" icon="eye" onClick={()=>setPrev(true)}>Preview</Button><Button variant="danger" icon="rotate-ccw" onClick={()=>{setItems([]);setPrev(false);setQ("")}}>Reset</Button><Button icon="printer" onClick={()=>{setPrev(true);setTimeout(()=>window.print(),100)}}>Print</Button></div>
{prev&&labels.length>0&&<div className="sp-preview"><div className="sp-labels" style={{gridTemplateColumns:"repeat("+cols+",1fr)"}}>{labels.map((p,i)=><div className="sp-lbl" key={i}>{co&&<b style={{display:"block"}}>SONTIC PLUS</b>}{pn&&<div style={{textTransform:"capitalize"}}>{p.name}</div>}{pr&&<div><b>Price:</b> {egp(p.price)}</div>}<Bars code={p.code}/><b>{p.code.toUpperCase()}</b></div>)}</div></div>}
</div></div><ConfirmDeleteModal open={!!del} itemType="product" itemName={del?del.name:undefined} onCancel={()=>setDel(null)} onConfirm={()=>{setItems(items.filter(x=>x.code!==del.code));setDel(null)}}/></AppShell>}
ReactDOM.createRoot(document.getElementById("r")).render(<App/>);</script></body></html>
