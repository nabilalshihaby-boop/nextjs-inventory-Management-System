<!DOCTYPE html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Sale Reports · Sontic Plus</title><link rel="stylesheet" href="styles.css"><script src="theme.js"></script></head><body><div id="r"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="nav.js"></script><script src="tabs.js"></script><script src="_ds_bundle.js"></script>
<script type="text/babel">const egp=n=>"EGP "+(+n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});const {AppShell,StatCard,Tabs,TableToolbar,DataTable,Pagination,Badge,Button,Field,Select,Input}=window.Industry_indust;
const shell=(tab,children)=><AppShell items={SP_NAV} activeId="re" title="Reports" tabs={SP_REPORT_TABS} moreTabs={SP_REPORT_MORE} activeTab={tab} userName="admin" userRole="Administrator" footer="All Rights Reserved © 2026 Sontic Plus">{children}</AppShell>;
const WH=({v,set,opts})=><div style={{width:420,margin:"0 auto 24px"}}><Field label="Warehouse"><Select value={v} onChange={e=>set(e.target.value)} options={opts}/></Field></div>;
const sale=[["SA_11149","71800.00"],["SA_11148","31920.00"],["SA_11147","7980.00"],["SA_11146","11970.00"],["SA_11145","7980.00"],["SA_11144","7480.00"],["SA_11143","11970.00"],["SA_11142","11470.00"],["SA_11141","11970.00"],["SA_11140","11970.00"]].map((r,i)=>({id:i,ref:r[0],total:egp(r[1]),paid:egp(r[1]),due:"EGP 0.00"}));
const code=v=><span className="sp-code">{v}</span>;
function App(){const [q,setQ]=React.useState("");const rows=sale.filter(r=>r.ref.toLowerCase().includes(q.toLowerCase()));
return shell("sale",<><TableToolbar value={q} onSearch={setQ}><Button variant="secondary" iconOnly icon="filter" aria-label="Filter"/><Button icon="file-spreadsheet">EXCEL</Button><div style={{width:240}}><Input type="date" aria-label="Select Date"/></div></TableToolbar>
<DataTable columns={[{key:"ref",header:"Reference",render:code},{key:"c",header:"Customer",render:()=>"direct-customer",primary:true},{key:"s",header:"Status",render:()=><Badge status="Received"/>},{key:"total",header:"Grand Total",align:"right"},{key:"paid",header:"Paid",align:"right"},{key:"p",header:"Payment Status",render:()=><Badge status="Paid"/>}]} rows={rows}><Pagination page={1} pageSize={10} total={49}/></DataTable></>)}
ReactDOM.createRoot(document.getElementById("r")).render(<App/>);</script></body></html>
