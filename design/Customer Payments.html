<!DOCTYPE html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Customer Payments · Sontic Plus</title><link rel="stylesheet" href="styles.css"><script src="theme.js"></script></head><body><div id="r"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="nav.js"></script><script src="tabs.js"></script><script src="_ds_bundle.js"></script><script src="demo.js"></script><script src="customer-data.js"></script><script src="fin.js"></script><script type="text/babel" src="demo.jsx"></script><script type="text/babel" src="finui.jsx"></script>
<script type="text/babel">const egp=n=>"EGP "+(+n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const {AppShell,PageHeader,TableToolbar,DataTable,Pagination,Button,Select,Input,Badge,Icon,Modal,ConfirmDeleteModal}=window.Industry_indust;
const dm=d=>d.split("-").reverse().join("/");const METHODS=["Cash","Bank Transfer","Card","Cheque"];
const SEED=CUSTOMERS.flatMap(c=>c.tx.filter(t=>t[2]==="Payment").map(t=>{const parts=t[3].split(" · ");return{id:t[1],date:t[0],ref:t[1],name:c.name,cu:c.id,method:parts[1],amount:t[4],inv:parts[2]||"",notes:"",acct:""}}));
function App(){useFin();const [toast,setToast]=useToast();const [gone,setGone]=React.useState([]);const [q,setQ]=React.useState(""),[cu,setCu]=React.useState("All"),[me,setMe]=React.useState("All"),[from,setFrom]=React.useState(""),[to,setTo]=React.useState("");const [page,setPage]=React.useState(1),[size,setSize]=React.useState(10);
const [modal,setModal]=React.useState(false),[view,setView]=React.useState(null),[del,setDel]=React.useState(null);
const demoRows=FIN.list("customer").map(p=>({id:p.id,date:p.date,ref:p.ref,name:p.party,cu:(CUSTOMERS.find(c=>c.name===p.party)||{}).id,method:p.method,amount:p.amount,inv:p.inv,notes:p.notes,acct:p.acct,demo:true}));
const rows0=[...demoRows,...SEED.filter(r=>!gone.includes(r.id)).sort((a,b)=>b.date.localeCompare(a.date))];
const rows=rows0.filter(r=>(!q||(r.ref+r.inv+r.notes+r.name).toLowerCase().includes(q.toLowerCase()))&&(cu==="All"||r.cu===cu)&&(me==="All"||r.method===me)&&(!from||r.date>=from)&&(!to||r.date<=to));
const shown=rows.slice((page-1)*size,page*size);const filt=q||cu!=="All"||me!=="All"||from||to;const reset=()=>{setQ("");setCu("All");setMe("All");setFrom("");setTo("")};
const cols=[{key:"date",header:"Payment Date",render:dm},{key:"ref",header:"Reference No.",render:(v,r)=><span><span className="sp-code">{v}</span>{r.demo&&<> <Badge tone="warning" dot={false}>Demo</Badge></>}</span>,text:r=>r.ref},{key:"name",header:"Customer",primary:true},{key:"method",header:"Payment Method",render:v=><Badge tone="primary" dot={false}>{v}</Badge>},{key:"acct",header:"Deposited To",render:v=>v?FIN.accName(v):"—"},{key:"amount",header:"Amount",align:"right",render:egp},{key:"inv",header:"Applied To",render:v=>v||<Badge tone="neutral" dot={false}>Unallocated</Badge>}];
return <AppShell items={SP_NAV} activeId="pe5" title="Customer Payments" userName="admin" userRole="Administrator" footer="All Rights Reserved © 2026 Sontic Plus">
<PageHeader title="Customer Payments"><Button icon="plus" onClick={()=>setModal(true)}>Record Customer Payment</Button></PageHeader>
<TableToolbar value={q} onSearch={v=>{setQ(v);setPage(1)}} searchPlaceholder="Search payments">
<div style={{width:190}}><Select aria-label="Customer" value={cu} onChange={e=>{setCu(e.target.value);setPage(1)}} options={[{value:"All",label:"All Customers"},...CUSTOMERS.map(c=>({value:c.id,label:c.name}))]}/></div>
<div style={{width:170}}><Select aria-label="Payment Method" value={me} onChange={e=>{setMe(e.target.value);setPage(1)}} options={["All",...METHODS]}/></div>
<div style={{width:160}}><Input type="date" aria-label="From date" value={from} onChange={e=>{setFrom(e.target.value);setPage(1)}}/></div><div style={{width:160}}><Input type="date" aria-label="To date" value={to} onChange={e=>{setTo(e.target.value);setPage(1)}}/></div></TableToolbar>
{rows.length===0?<div className="sp-card sp-empty"><Icon name="inbox" size={36}/><div className="t-section-title">{filt?"No payments match your filters":"No customer payments yet"}</div>{filt&&<Button variant="secondary" onClick={reset}>Clear filters</Button>}</div>
:<DataTable columns={cols} rows={shown} footer={{amount:egp(rows.reduce((a,r)=>a+r.amount,0))}} actions={r=>[{label:"View",icon:"eye",onClick:()=>setView(r)},{label:"Account Statement",icon:"file-text",onClick:()=>location.href="Customer Statement.html?customer="+r.cu},"-",{label:"Delete",icon:"trash-2",danger:true,onClick:()=>setDel(r)}]}><Pagination page={page} pageSize={size} total={rows.length} onPage={setPage} onPageSize={m=>{setSize(m);setPage(1)}}/></DataTable>}
<Modal open={!!view} size="md" title={view?"Payment "+view.ref:""} onClose={()=>setView(null)} footer={<><Button variant="secondary" onClick={()=>setView(null)}>Close</Button>{view&&<Button icon="file-text" onClick={()=>location.href="Customer Statement.html?customer="+view.cu}>Account Statement</Button>}</>}>
{view&&<div style={{display:"grid",gridTemplateColumns:"auto 1fr",gap:"12px 24px",font:"400 14px/20px var(--font-body)"}}><b>Customer</b><span>{view.name}</span><b>Payment Date</b><span>{dm(view.date)}</span><b>Method</b><span>{view.method}</span><b>Amount</b><span>{egp(view.amount)}</span><b>Deposited To</b><span>{view.acct?FIN.accName(view.acct):"—"}</span><b>Applied To</b><span>{view.inv||"Unallocated"}</span><b>Notes</b><span>{view.notes||"—"}</span></div>}</Modal>
<PaymentModal kind="customer" open={modal} onClose={()=>setModal(false)} onSaved={r=>setToast("Payment "+r.ref+" recorded (demo only)")}/>
<ConfirmDeleteModal open={!!del} itemType="customer payment" itemName={del?del.ref:undefined} onCancel={()=>setDel(null)} onConfirm={()=>{if(del.demo)FIN.remove(del.id);else setGone([...gone,del.id]);setDel(null);setToast("Payment deleted")}}/>{toast}</AppShell>}
ReactDOM.createRoot(document.getElementById("r")).render(<App/>);</script></body></html>
