<!DOCTYPE html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Expenses · Sontic Plus</title><link rel="stylesheet" href="styles.css"><script src="theme.js"></script></head><body><div id="r"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="nav.js"></script><script src="_ds_bundle.js"></script>
<script type="text/babel">const egp=n=>"EGP "+(+n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});const {AppShell,TableToolbar,DataTable,Pagination,Badge,Button,Modal,Icon,ConfirmDeleteModal}=window.Industry_indust;
const Act=({onEdit,onDel})=><span style={{display:"flex",gap:2,justifyContent:"flex-end"}}><Button variant="ghost" size="sm" iconOnly icon="pencil" aria-label="Edit" style={{color:"var(--primary-600)"}} onClick={onEdit}/><Button variant="ghost" size="sm" iconOnly icon="trash-2" aria-label="Delete" style={{color:"var(--danger-500)"}} onClick={onDel}/></span>;
const D0=[["EX_114","Salary","Arabi Salary","10000.00","11:52 PM","08/02/2024"],["EX_113","Raju Payment","USA Raju Payment","33000.00","11:51 PM","06/02/2024"],["EX_112","Software","Other Cost","10000.00","3:05 AM","02/02/2024"],["EX_111","Raju Ads Payment","USA Raju Payment","80000.00","3:04 AM","03/02/2024"]].map((r,i)=>({id:i,ref:r[0],title:r[1],cat:r[2],amt:egp(r[3]),at:r[4]+" · "+r[5]}));
function App(){const [rows,setRows]=React.useState(D0);const [q,setQ]=React.useState("");const [del,setDel]=React.useState(null);
const v=rows.filter(r=>(r.ref+r.title+r.cat).toLowerCase().includes(q.toLowerCase()));
const cols=[{key:"ref",header:"Reference",render:x=><span className="sp-code">{x}</span>},{key:"title",header:"Expense Title",primary:true},{key:"wh",header:"Warehouse",render:()=>"Office"},{key:"cat",header:"Expense Category"},{key:"amt",header:"Amount",align:"right"},{key:"at",header:"Created On",render:x=><Badge tone="info" dot={false}>{x}</Badge>},{key:"act",header:"Action",align:"right",render:(x,r)=><Act onEdit={()=>location.href="Update Expense.html?"+new URLSearchParams({ref:r.ref,title:r.title,cat:r.cat,amt:r.amt.replace(/[^0-9.]/g,""),at:r.at})} onDel={()=>setDel(r)}/>}];
return <AppShell items={SP_NAV} activeId="e1" title="Expenses" userName="admin" userRole="Administrator" footer="All Rights Reserved © 2026 Sontic Plus">
<TableToolbar value={q} onSearch={setQ}><Button icon="plus" onClick={()=>location.href="Create Expense.html"}>Create Expense</Button></TableToolbar>
<DataTable columns={cols} rows={v}><Pagination page={1} pageSize={10} total={v.length}/></DataTable><ConfirmDeleteModal open={!!del} itemType="expense" itemName={del?del.title:undefined} onCancel={()=>setDel(null)} onConfirm={()=>{setRows(rows.filter(y=>y.id!==del.id));setDel(null)}}/></AppShell>}
ReactDOM.createRoot(document.getElementById("r")).render(<App/>);</script></body></html>
