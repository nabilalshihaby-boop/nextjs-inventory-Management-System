<!DOCTYPE html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Email Templates · Sontic Plus</title><link rel="stylesheet" href="styles.css"><script src="theme.js"></script></head><body><div id="r"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="nav.js"></script><script src="_ds_bundle.js"></script>
<script type="text/babel">const {AppShell,TableToolbar,DataTable,Pagination,Modal,Field,Input,Textarea,Switch,Badge,Button,ConfirmDeleteModal}=window.Industry_indust;
const Act=({onEdit,onDel})=><span style={{display:"flex",gap:2,justifyContent:"flex-end"}}><Button variant="ghost" size="sm" iconOnly icon="pencil" aria-label="Edit" style={{color:"var(--primary-600)"}} onClick={onEdit}/><Button variant="ghost" size="sm" iconOnly icon="trash-2" aria-label="Delete" style={{color:"var(--danger-500)"}} onClick={onDel}/></span>;
function App(){const [del,setDel]=React.useState(null);
const [rows,setRows]=React.useState([{id:1,name:"Sale Invoice",subject:"Your invoice {reference}",body:"Hello {customer_name},\n\nThank you for your purchase. Your invoice {reference} for {grand_total} is attached.\n\n{company_name}",active:true},{id:2,name:"Purchase Order",subject:"Purchase order {reference}",body:"Hello {supplier_name},\n\nPlease find purchase order {reference} for {grand_total}.\n\n{company_name}",active:true},{id:3,name:"Payment Reminder",subject:"Payment due for {reference}",body:"Hello {customer_name},\n\nA payment of {due_amount} is due for {reference}.\n\n{company_name}",active:false}]);const [q,setQ]=React.useState("");
const [m,setM]=React.useState(null);const [f,setF]=React.useState({name:"",subject:"",body:"",active:true});const [err,setErr]=React.useState({});
const open=r=>{setM(r||{});setF(r?{name:r.name,subject:r.subject,body:r.body,active:r.active}:{name:"",subject:"",body:"",active:true});setErr({})};const set=k=>e=>{setF({...f,[k]:e.target.value});setErr({...err,[k]:""})};const close=()=>setM(null);
const save=()=>{const n={};if(!f.name.trim())n.name="Name is required";if(!f.subject.trim())n.subject="Subject is required";if(!f.body.trim())n.body="Message is required";setErr(n);if(Object.keys(n).length)return;setRows(m.id?rows.map(x=>x.id===m.id?{...x,...f}:x):[...rows,{id:Date.now(),...f}]);close()};
const v=rows.filter(r=>(r.name+r.subject).toLowerCase().includes(q.toLowerCase()));
const cols=[{key:"name",header:"Name",primary:true},{key:"subject",header:"Subject"},{key:"active",header:"Status",render:x=><Badge tone={x?"success":"neutral"}>{x?"Active":"Inactive"}</Badge>},{key:"act",header:"Action",align:"right",render:(x,r)=><Act onEdit={()=>open(r)} onDel={()=>setDel(r)}/>}];
return <AppShell items={SP_NAV} activeId="t1" title="Email Templates" userName="admin" userRole="Administrator" footer="All Rights Reserved © 2026 Sontic Plus">
<TableToolbar value={q} onSearch={setQ}><Button icon="plus" onClick={()=>open()}>Create Template</Button></TableToolbar>
<DataTable columns={cols} rows={v}><Pagination page={1} pageSize={10} total={v.length}/></DataTable>
<Modal open={!!m} size="lg" title={m&&m.id?"Edit Template":"Create Template"} onClose={close} footer={<><Button variant="secondary" onClick={close}>Cancel</Button><Button onClick={save}>Save</Button></>}>
<div style={{display:"flex",flexDirection:"column",gap:20}}><Field label="Template Name" required error={err.name}><Input placeholder="Enter Template Name" value={f.name} onChange={set("name")} autoFocus/></Field><Field label="Subject" required error={err.subject}><Input placeholder="Enter Subject" value={f.subject} onChange={set("subject")}/></Field><Field label="Message" required error={err.body} hint="Variables: {customer_name}, {supplier_name}, {reference}, {grand_total}, {due_amount}, {company_name}"><Textarea rows={8} placeholder="Enter Message" value={f.body} onChange={set("body")}/></Field><Switch label="Active" checked={f.active} onChange={e=>setF({...f,active:e.target.checked})}/></div></Modal><ConfirmDeleteModal open={!!del} itemType="email template" itemName={del?del.name:undefined} onCancel={()=>setDel(null)} onConfirm={()=>{setRows(rows.filter(y=>y.id!==del.id));setDel(null)}}/></AppShell>}
ReactDOM.createRoot(document.getElementById("r")).render(<App/>);</script></body></html>
